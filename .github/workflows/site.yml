name: site
# Rebuilds the site from site/ and the design record, fails if docs/ was not
# regenerated, then checks links, privacy (D50) and framing (D42, D46).
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r site/requirements.txt
      - name: docs/ matches its sources
        run: python site/build.py --check
      - name: links, privacy, framing
        run: python site/check.py
