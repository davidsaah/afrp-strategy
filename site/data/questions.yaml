# Open questions, one Q-number each (D43). The same number is used in GitHub
# Discussions and in the committee's Google Doc. When a question is answered it
# moves to the Decisions Register and its row here gets `decided: D-n`.
# goal: a key from goals.yaml; branch: a key from branches.yaml or "all".
- id: Q-1
  title: The two By-Law 9.1.3 amendment drafts
  detail: Decision 5 was reopened on 21 August after being recorded in error. Whether either draft goes to the floor is undecided; both are two-thirds delegate votes, so 9.1.3's weighted voting applies to the amendments that fix it.
  owner: Board · Constitution Committee
  goal: governance
  branch: junction
  source: Decisions Register D5
- id: Q-2
  title: Governing documents cited and not on file
  detail: "Two of five are found (October 2026): the Endowment Fund Policy Statement (2012) and the Scholarship Fund Policy Statement (revised at the 2015 Convention). Both make a 4% programme distribution and a 1% transfer to AFRP mandatory each year, together equal to the by-laws' 5% limit; see design/bylaws/ARFECF-2015-and-the-fund-policies.md. Still not on file: ARFECF's exempt-status determination letter, the Board Rules & Regulations (the authority for the dues tiers), and the ARFHSN trustee roster."
  owner: AFRP · ARFECF
  goal: funding
  branch: all
  source: Decisions Register, "What is actually left"
- id: Q-3
  title: The CPA's countersignature on the agency treatment of club dues
  detail: Decision 1 treats club dues AFRP collects as held for the clubs. A named officer now approves each remittance run; the CPA's answer still decides whether the treatment is defensible on the books.
  owner: CPA
  goal: funding
  branch: all
  source: Decisions Register D1; AFRP-Adviser-Brief.md
- id: Q-4
  title: Does a same-sex spouse qualify under By-Law 4.1.1?
  detail: The text admits a person "married to one having such origin". It is gender-neutral and names no restriction.
  owner: Membership Committee
  goal: members
  branch: heritage
  source: Design Status
- id: Q-5
  title: Which pedigree slot carries which parent, where two parents are the same sex?
  detail: The family-tree file format assumes a father slot and a mother slot. Does a child inherit descent through either?
  owner: Family Tree Committee · Membership Committee
  goal: heritage
  branch: heritage
  source: Design Status
- id: Q-6
  title: A long-term unmarried partner is not "married to"
  detail: Is the 4.2.1 associate route, for "special circumstances", the intended home?
  owner: Membership Committee, then the Board
  goal: members
  branch: heritage
  source: Design Status
- id: Q-7
  title: Does a membership survive the divorce it was admitted through?
  detail: A member admitted as "married to one having such origin" divorces that spouse. The by-laws are silent.
  owner: Membership Committee
  goal: members
  branch: heritage
  source: Design Status
- id: Q-8
  title: Which club does a child in two households belong to?
  detail: Pickup and directory choices are answered. Club attachment is ratified as staying open, because it carries dues and voting consequences and By-Law 4.3.1 is silent.
  owner: Membership Committee
  goal: members
  branch: education
  source: Design Status; AFRP-R6-Minor-Authority.md
- id: Q-9
  title: Adoption
  detail: An adopted child may be wholly family socially and not a descendant genealogically. Until this is answered the platform records an adoptive link as non-lineage and infers nothing.
  owner: Membership Committee · Family Tree Committee
  goal: heritage
  branch: heritage
  source: Design Status
- id: Q-10
  title: Does a suspension recorded after certification withhold the ballot?
  detail: The voter roll is frozen so nobody can be disenfranchised after it. A member suspended on the morning of the poll still holds a roll entry; both readings are defensible.
  owner: Board · Elections Committee
  goal: governance
  branch: junction
  source: Design Status
- id: Q-11
  title: A Scholarship Committee no by-law constitutes
  detail: Members are certified to vote for a Scholarship Committee that no AFRP by-law creates. With ARFECF as the scholarship's home this is a cross-entity election, which works but must be written down.
  owner: Constitution Committee
  goal: governance
  branch: education
  source: Design Status; D3
  decided: "D58"
- id: Q-12
  title: Ramallah Works
  detail: Named as a priority at the committee's 10 September 2026 meeting, and on no programme register or design document. What is it, and which branch does it belong on?
  owner: Strategic Planning Committee
  goal: next-generation
  branch: all
  source: Crosswalk A8; D42
  decided: "D64"
- id: Q-13
  title: The Presidential Advisory Council
  detail: Proposed in the 2021 Recommendations. Was it adopted? It is not in the 2024 by-laws analysis.
  owner: Strategic Planning Committee · Board
  goal: governance
  branch: all
  source: Crosswalk B6
- id: Q-14
  title: The Strategic Plan Committee's composition
  detail: By-Law 7.3.3 has the Deputy President chair the committee with four members the Deputy President appoints and the Board approves. Does the current roster follow it?
  owner: Strategic Planning Committee · Board
  goal: governance
  branch: all
  source: Crosswalk B14
  decided: "Confirmed by the project owner, 1 Oct 2026: the roster follows By-Law 7.3.3"
- id: Q-15
  title: Who maintains and pays for the platform after launch?
  detail: No document names a maintainer or an annual budget line. The previous system could not be maintained once its contractor left.
  owner: Board
  goal: members
  branch: all
  source: Crosswalk D12
- id: Q-16
  title: The archive of record
  detail: Is it the platform, a shared drive, or both, and who owns it?
  owner: Strategic Planning Committee
  goal: heritage
  branch: heritage
  source: Crosswalk C4
  decided: "D66"
- id: Q-17
  title: Which revision of the 2021 Recommendations was adopted?
  detail: By-Law 17.1.4 incorporates the "Strategic Planning Proposal". The 3 May 2021 revision is located but not yet shown by minutes to be the one voted at Jacksonville.
  owner: Strategic Planning Committee
  goal: governance
  branch: all
  source: AFRP-Bylaws-Ingestion-Architecture.md
- id: Q-18
  title: Which entity runs Women to Women, Preservation and Project Hope?
  detail: afrp.org groups some of them under the Ramallah Foundation; the prototype and the money map disagree. It decides whose books, board and tax return carry them.
  owner: Board
  goal: funding
  branch: care
  source: AFRP-Program-Architecture.md §0
  decided: "D55"
- id: Q-19
  title: How are outcomes measured for each branch?
  detail: Decision 42 asks for outcome reporting per branch so donors can see a return. Which measures, and which are published, is not yet defined.
  owner: Strategic Planning Committee
  goal: funding
  branch: all
  source: D42
  decided: "D67"
- id: Q-20
  title: A successor to the High School Senior Award
  detail: The award was retired by the Board on 31 August 2026, leaving a gap between Camp Ramallah and the Scholarship.
  owner: Board
  goal: next-generation
  branch: education
  source: AFRP-Program-Architecture.md §6
# Added 1 October 2026 from the intake of the Federation's and the affiliates'
# working files (ARFHSN, ARFECF, AFRP and the officer archive). Each cites the
# kind of document it came from; the files themselves are in the Federation's
# drive and several name living people, so none is quoted here.
- id: Q-21
  title: Which entity receipts a Medical Mission gift?
  detail: Gifts for the Medical Mission and the Human Services Network are taken through the Federation's giving pages and forwarded to ARFHSN. Decision 9 receipts a gift in the name of the entity that receives it, and ARFHSN's by-laws describe ARFHSN as the 501(c)(3). The record does not say which entity's receipt these gifts carry.
  owner: AFRP Treasurer · ARFHSN Board · CPA
  goal: funding
  branch: care
  source: ARFHSN board minutes (2023); Decisions Register D9; ARFHSN By-Laws Art. III
  decided: "D56"
- id: Q-22
  title: Is the Medical Mission a programme of ARFHSN or a committee of the Federation?
  detail: Its gifts are held by ARFHSN and its agreements are signed by ARFHSN, but its committee was convened by the Federation President in 2023 with its own terms of reference. Who appoints its chair and who approves its spending is not written down.
  owner: AFRP Board · ARFHSN Board
  goal: governance
  branch: care
  source: Medical Mission committee records (2023–2025)
  decided: "D62"
- id: Q-23
  title: ARFHSN's finance manual
  detail: A draft Finance and Accounting Manual (2026) sets approval tiers for roles ARFHSN does not have (a paid director, an accounting manager). Until a manual is adopted, the record holds only the by-laws' two-signature rule.
  owner: ARFHSN Board
  goal: operations
  branch: care
  source: ARFHSN draft Finance and Accounting Manual (2026)
  decided: "D63"
- id: Q-24
  title: Safeguarding funds and equipment delivered in Ramallah
  detail: An inventory, inspections, a written agreement with each receiving hospital and a local committee have been proposed since 2023. None is written down.
  owner: ARFHSN Board · AFRP legal advisor
  goal: operations
  branch: care
  source: ARFHSN board minutes (2023, 2024)
  decided: "D63"
- id: Q-25
  title: How club money for Care projects is credited to the club
  detail: Clubs co-fund ARFHSN projects and run appeals for them, and a committee fund (Women to Women) is held inside ARFHSN's books. Nothing records which club raised or co-funded what.
  owner: AFRP Board · ARFHSN Board · Club presidents
  goal: clubs
  branch: care
  source: ARFHSN board minutes (2020, 2026); a 2017 treasurer's report
  decided: "D57"
- id: Q-26
  title: The six-monthly ARFHSN report to the AFRP Board
  detail: ARFHSN's by-laws require a financial and operational report to the AFRP Board every six months. The minutes show it presented once. Whether the platform should produce it on a schedule is undecided.
  owner: ARFHSN Board · AFRP Board
  goal: governance
  branch: care
  source: ARFHSN By-Laws Art. III §7
  decided: "D63"
- id: Q-27
  title: Which entity holds each programme's money?
  detail: The record names AFRP for Camp Ramallah, the Arabic Program, Project Hope, Leadership Ramallah, the Exchange Mission and RBPN. ARFECF's Educational Fund budgets Camp, Arabic, Project Hope, the exchange mission and the scholarships; ARFECF's Board approved RBPN's first budget; the Preservation Project's vendor account and the Magazine's assets are ARFECF's; ARFECF's by-laws name Project Hope and the Leadership Program among the Endowment's purposes. Government Affairs and the Day of Action moved to AFRP's General Fund.
  owner: AFRP Board · ARFECF Board
  goal: funding
  branch: all
  source: ARFECF By-Laws 6.3.1; the 2026–27 budget; programme records
  decided: "D55"
- id: Q-28
  title: Which ARFECF by-laws text is in force?
  detail: Answered by text (October 2026). The ARFECF By-Laws as revised at the 2015 Chicago Convention are the latest found; they carry the regional seats by club and the four-member cap on overlap with the AFRP Board, which the record had called unsupported. The regional club lists are out of date and are the ARFECF Board's to bring current.
  owner: ARFECF Board
  goal: governance
  branch: junction
  source: design/bylaws/ARFECF-2015-and-the-fund-policies.md
  decided: "By-law text: ARFECF By-Laws, revised 2015"
- id: Q-29
  title: The Ramallah Foundation's seats on the Scholarship Committee
  detail: Decision 3 makes the Foundation a partner by agreement, not a governor, and the 2015 Scholarship Fund Policy sets the committee as a chairman, the executive director, Board-chosen members and three members elected at the Convention, with no Foundation seats. The committee's current overview lists Foundation representatives among its members.
  owner: ARFECF Board · Scholarship Committee
  goal: governance
  branch: education
  source: Decisions Register D3; Scholarship Fund Policy Statement (2015); the committee's 2026 overview
  decided: "D58"
- id: Q-30
  title: Club cost-sharing for programmes
  detail: Clubs give camp rebates, are expected to share Leadership Ramallah travel, and are reimbursed for hosting RBPN events. Each programme sets its own terms. Whether one shared rule applies, and how a club's share is credited, is not settled.
  owner: AFRP Board · Club presidents
  goal: clubs
  branch: all
  source: Camp, Leadership Ramallah and RBPN records (2019–2026)
  decided: "D57"
- id: Q-31
  title: Non-members in Arabic classes
  detail: The programme committee has decided to admit non-members at a higher rate. Whether the platform sells a class to someone who has not joined, and what record it keeps of them, is undecided.
  owner: Arabic committee · AFRP Board
  goal: members
  branch: education
  source: Arabic Program strategy meeting (August 2026)
  decided: "D60"
- id: Q-32
  title: What applicant, camper and travel records the platform imports
  detail: Applications, health and consent forms, income documents and passports for several programmes sit in shared folders, many about minors. Which are migrated, which stay where they are, and when each is deleted is not decided.
  owner: AFRP Board · Executive Director
  goal: operations
  branch: all
  source: Programme folders in the Federation's drive
  decided: "D61"
- id: Q-33
  title: The 2026 restated constitution
  detail: A restatement prepared in spring 2026 would reduce the Board to 21 with five elected chapter representatives, make Convention votes advisory, define standing on AFRP dues alone, let the Board amend by majority and drop the affiliation, weighted-delegate and Selection Committee articles. Its adoption certificate is blank. As of October 2026 it is deferred and under Board review, so the 2024 text remains in force and the record stays built on it. If it is adopted it outranks every decision built on the 2024 text (D41).
  owner: AFRP Board · Constitution Committee
  goal: governance
  branch: junction
  source: The Federation's constitution folder (2026 restatement drafts); Board minutes, September 2026
- id: Q-34
  title: The Federation's share of convention proceeds
  detail: The host-club agreement has existed as a Board-approved template since 2009, revised in 2022, and sets a fixed share; a 2021 resolution set one flat share for every host; the 2024 General Assembly voted a different one because no contract was signed; the Convention Innovation Committee is discussing a percentage split. No signed host agreement has been found for any year.
  owner: AFRP Board · Convention Innovation Committee
  goal: clubs
  branch: junction
  source: Host-club agreement template (2009, 2022); General Assembly 2024; committee minutes 2026
  decided: "D59"
- id: Q-35
  title: The endowment's rules and its holding entity
  detail: The 2012 Endowment Fund Policy Statement governs today. A 2025 distribution guide, an undated draft, sets a cap on a three-year average and a share of every restricted gift for operations, and calls the fund the AFRP Endowed Fund held across AFRP and ARFECF accounts. Decision 2 puts the endowment in ARFECF. An investment policy statement goes to both boards in November 2026.
  owner: AFRP Board · ARFECF Board · Investment Committee
  goal: funding
  branch: care
  source: Endowment Fund Policy Statement (2012); Endowed Fund guide (2025 draft); Decisions Register D2
- id: Q-36
  title: How local club dues are collected and passed on
  detail: The 2024 by-laws make club dues part of good standing and require club money for AFRP projects to pass through headquarters. Seventeen years of by-laws, budgets and minutes hold no rule on whether members can opt out of local dues, who collects them, or when they are passed to the club; one club collects them separately. Decision 1 is the record's answer and nothing found contradicts it.
  owner: AFRP Treasurer · Club presidents
  goal: clubs
  branch: all
  source: By-Laws 2024; club records; Decisions Register D1
  decided: "D57 (the rule stays D1)"
- id: Q-37
  title: How convention delegates are certified
  detail: Per-club voting lists are produced from the member database before the Convention. Who certifies them, the cut-off and the quorum rule are not written down.
  owner: Selection Committee · AFRP Board
  goal: governance
  branch: junction
  source: Convention and club records (2026)
- id: Q-38
  title: Who may lobby, and how it is recorded
  detail: An IRS letter (2011) and the by-laws describe AFRP as a 501(c)(4) and its affiliates as 501(c)(3)s; one contract describes AFRP otherwise. AFRP issues statements on legislation and runs the Day of Action. Nothing records which entity carries advocacy activity or how its cost is tracked.
  owner: AFRP Board · Legal Advisor
  goal: voice
  branch: leadership
  source: By-Laws 2024; Government Affairs records; IRS determination letter (2011)
  decided: "D65"
- id: Q-39
  title: AFRPWorks, the Ramallah Jobs Initiative
  detail: The initiative matching member employers with skilled people in Ramallah has a prototype and a pilot plan. Its owning committee, holding entity, fee model and branch are not settled; RBPN's job board and ARFHSN's economic-development purpose both touch it. This is the "Ramallah Works" of crosswalk row A8.
  owner: Jobs Initiative working group · AFRP Board
  goal: next-generation
  branch: all
  source: AFRPWorks announcement; working-group minutes (September 2026); crosswalk A8
  decided: "D64"
- id: Q-40
  title: Who approves a club's affiliation, and what a late officers form costs
  detail: By-Law 3.1 affiliates a club "with the approval of the A.F.R.P." and 3.2 requires the officers form by 1 August; 6.4.1 seats only compliant clubs on the Council while 8.4.1 seats all presidents, a drafting item for the Constitution Committee. Nothing says who gives the approval, whether it is once or yearly, or what a late or missing form costs beyond the Council seat the text implies. No affiliation forms are on file for any year.
  owner: AFRP Board · Executive Director · Constitution Committee
  goal: clubs
  branch: junction
  source: By-Laws 2024 (3.1, 3.2, 6.4.1); the Federation's club records; Club Experience Plan §6.2
- id: Q-41
  title: Two clubs at once, and moving between clubs
  detail: 'By-Law 4.3.1 keys good standing to "his/her AFRP and Local Club (if any)" dues, one club; the platform allows several club memberships (J02). Which club''s standing counts for a seat or a vote, whether a member may hold two, and who decides a move between clubs are not written. The minor-in-two-households attachment is the same question (Rules Register R4).'
  owner: Membership Committee · AFRP Board
  goal: clubs
  branch: all
  source: By-Laws 2024 (4.3.1, 6.2.3, 9.1.3); Club Experience Plan §6.3
- id: Q-42
  title: The Council's monthly meeting and its attendance expectation
  detail: By-Law 10.5.1 requires the Council of Chapter Club Presidents to meet at least twice a year; in practice it meets monthly, and the 2020 letters to presidents set an attendance expectation that no record tallies and no by-law or Board rule holds. The platform can count attendance; it does not enforce a rule that is not written.
  owner: AFRP Board · Deputy President
  goal: clubs
  branch: junction
  source: By-Laws 2024 (6.4.1, 10.5.1); letters to club presidents (2020); Council meeting notes (2020–2026)
- id: Q-43
  title: Whether a club's own membership tiers are the club's to define
  detail: The club SOP (2025) describes club tiers for young adults, youth and children with club-set dues; the Federation's membership classes are the by-laws'. The platform keeps club tiers as club groups, not as standing, until a rule says otherwise.
  owner: Membership Committee
  goal: clubs
  branch: all
  source: Club SOP (2025); By-Laws 2024 Article IV; Club Experience Plan §6.6
- id: Q-44
  title: The Executive Director's access to club records against the counts-only rule
  detail: By-Law 7.9.3 gives the Executive Director access to all Federation and Chapter Club records; the clubs page as built shows the Federation a club's data as counts, never names (Breeze Parity §3, slice B1). Four-Lens §6.3 (August 2026) lets national staff read every club roster without export; Breeze Parity (September 2026) built the view as counts; which of the two applies to a named-purpose read under 7.9.3 is part of this question. The text wins over both; the platform needs the purposes for which that access is used and an audit line for each use.
  owner: AFRP Board · Legal Advisor
  goal: governance
  branch: junction
  source: By-Laws 2024 (7.9.3); design/AFRP-Breeze-Club-Parity.md §3; design/AFRP-Four-Lens-Architecture.md §6.3; Club Experience Plan §3.3
- id: Q-45
  title: Who appoints a club's seats in a programme
  detail: Programmes name per-club roles the by-laws do not (the camp liaison, the scholarship outreach contact, the Day of Action travel coordinator, the Arabic volunteers' lead, the dabke lead, the Mid-Year sponsor-outreach lead); today both the club and the programme committee appoint them. Until a rule says which, the officers form offers the seat and the committee may also appoint it, each appointment naming who made it.
  owner: AFRP Board · programme committees
  goal: clubs
  branch: all
  source: Programme committee records (2019–2026); Club Experience Plan §3.4
- id: Q-46
  title: Whether a member may know a follow-up exists about them
  detail: A club's follow-up is a task about a person, closed and never deleted, read by the club's officers and nobody else (Breeze Parity §4). Whether the member may know one exists, or read it, is a question of privacy law that varies by state and is not in the record. The same question covers what a member who has never signed in is deemed to have consented to (the plan proposes no for marketing, yes for operational messages, as a design choice).
  owner: Legal Advisor · Membership Committee
  goal: clubs
  branch: all
  source: design/AFRP-Breeze-Club-Parity.md §4; Club Experience Plan §3.5
- id: Q-47
  title: The club statement's terms no committee has written
  detail: The club-share statement (D57) needs terms the record does not hold - the remittance cadence, minimum and sign-off; who bears the processing fee; the camp rebate term (three clubs give rebates on their own and the committee wants pooled club funds); the dabke travel term, minuted case by case; whether a share of the convention ad book goes to the host club. Each is its committee's to set and the register's to hold.
  owner: Finance Committee · Camp Ramallah committee · Convention Innovation Committee
  goal: clubs
  branch: all
  source: design/AFRP-Multi-Entity-Ledger.md §8; camp committee records; Convention Innovation Committee minutes (2025–2026); Club Experience Plan §5.5
- id: Q-48
  title: Finding members "near me"
  detail: The directory places members by city, a field shown under the member's own consent. A metro area derived from the city or postcode already displayed is one answer; a radius search on a stored address is a new purpose nobody has consented to and would reveal distance even when the address is withheld. The record's browse axes do not include distance.
  owner: Membership Committee · Legal Advisor
  goal: members
  branch: all
  source: design/AFRP-Camp-Directory-Network-Plan.md (browse axes); design/AFRP-Directory-Formats.md §2
- id: Q-49
  title: Community contacts for places without a chapter club
  detail: The Federation's printed Committee Directory listed a contact person for each community with no chapter club. No by-law names such a seat and the platform has none; the Membership Committee's composition (By-Law 8.12.1) reaches only communities with a chapter. Whether the Federation appoints community contacts, who appoints them, and what the leadership directory shows them as is not written.
  owner: AFRP Board · Membership Committee
  goal: clubs
  branch: junction
  source: Committee Directory 2017–18 (the officer archive, structure only; later editions listed, not read); By-Laws 2024 (8.12.1); design/AFRP-Directory-Formats.md §2
