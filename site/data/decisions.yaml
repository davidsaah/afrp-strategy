- key: voting
  title: Voting and the 9.1.3 drafts
  current_rule: >-
    Full digital voting is the approved direction; until the conforming amendment to By-Law 9.2 is
    ratified the 2024 text is the law, and the platform runs it in full as the transitional channel
    (D4). Whether either 9.1.3 amendment draft goes to the floor is undecided (D5, reopened).
  decisions: [D4, D5]
  superseded: []
  open_questions: [Q-1, Q-10, Q-33]
