# Two strands that meet: the Federation's strategy, and the platform's design.
- date: "Jun 2009"
  strand: federation
  title: Constitution and the Convention Contract
  text: A new Constitution and By-Laws, and the first Board-approved contract between the Federation and a host club, setting the Federation's share by the size of the host community.
- date: "Jul 2011"
  strand: federation
  title: The first Strategic Plan
  text: Adopted at the Washington Convention and made mandatory, with six action plans and a budget line of its own.
- date: "Aug 2012"
  strand: federation
  title: The fund policies
  text: Policy statements for the Endowment and Scholarship funds make a fixed annual distribution mandatory, part to programmes and part to the Federation for administration.
- date: "2013"
  strand: federation
  title: ARFECF's by-laws
  text: A fifteen-member Board for the education and charitable fund, approved at the Detroit Convention.
- date: "Jul 2015"
  strand: federation
  title: Revisions at Chicago
  text: The fund's by-laws and Scholarship policy are revised; Board seats are spread across three regions defined by clubs, and three Scholarship Committee members are elected at the Convention.
- date: "2016"
  strand: federation
  title: A five-year sponsor
  text: A bank sponsorship supports Conventions, Project Hope, the Medical Mission and exchange travel through 2021.
- date: "2018"
  strand: federation
  title: The Federation's SWOT
  text: The Strategic Planning Committee's analysis names the problems every later plan returns to. There is no database or CRM and no archives, the culture does not feel welcoming, and members leave over "perceived disorganisation".
- date: "May 2019"
  strand: federation
  title: Strategic Plan 2018–2023
  text: A five-year plan with six pillars (constitutional review, administration, information technology, communications, programming and government relations). It commits to a CRM, a Program Coordinator, an Executive Director, and a youth pipeline from camp to professional life.
- date: "2020"
  strand: federation
  title: The committee sets its priorities
  text: Accountability reporting from every committee, programme evaluation, recruiting younger members, hiring an Executive Director and "implement the new CRM".
- date: "2020"
  strand: federation
  title: Relief in the pandemic
  text: The Relief Fund begins monthly support to families in Ramallah, and the Federation makes grants to clubs.
- date: "May 2021"
  strand: federation
  title: Federation 2.0, the 2020–21 Recommendations
  text: Communications, Mid-Year and Convention guidelines, and administrative infrastructure. This includes the Selection Committee, job descriptions and reporting templates, plus the first requirements for an AFRP app. The stated goal is to attract and retain young adults. The 2024 by-laws later incorporate its Selection Committee.
- date: "2021"
  strand: federation
  title: A calendar membership year
  text: The membership year moves to the calendar year, and the Selection Committee replaces the nominations, credentials and elections committees.
- date: "Oct 2022"
  strand: federation
  title: The Convention agreement
  text: Hosting, money and records rules for every Convention. Registration records belong to the Federation.
- date: "2023"
  strand: federation
  title: A CRM goes live
  text: The committee wants the database ready for the Convention. By September it is live, but getting members registered is hard. In 2024 it runs over budget, and once its contractor leaves nobody can maintain it.
- date: "Jul 2024"
  strand: federation
  title: New Constitution and By-Laws
  text: Adopted at Jacksonville, including the Selection Committee (Article XVII).
- date: "Mar 2025"
  strand: federation
  title: Every committee asked for a SWOT
  text: The Deputy President's survey asks every committee for its purpose, what worked, its goals and its budget. Succession and younger members come back in almost every answer.
- date: "Aug 2026"
  strand: platform
  title: The platform is designed
  text: Architecture, the member experience, programmes and money are designed. The Board's blocking decisions (D1–D6) are answered on 20 August, twenty more follow the next day, and thirteen red-team rounds attack the design.
- date: "4 Sep 2026"
  strand: platform
  title: The build starts
  text: AFRP-Hub is built as a plain, long-lived Django application, chosen for "who maintains this in 2031".
- date: "8 Sep 2026"
  strand: platform
  title: The family tree becomes the spine
  text: Decisions D30–D41 make every member a node on the tree, and set the four branches (Education, Leadership, Heritage, Care) with the Convention as the junction.
- date: "10 Sep 2026"
  strand: federation
  title: The Strategic Planning Committee restarts
  text: It asks for a data-driven, outcome-based plan, an endowment campaign, an Executive Director and a central archive.
- date: "29 Sep 2026"
  strand: platform
  title: One public design record
  text: The design record and the prototypes move into this public repository.
- date: "30 Sep 2026"
  strand: both
  title: The two strands meet
  text: The Federation's plans are mapped element by element onto the platform (the crosswalk). The strategy is framed on the four branches (D42), and this site becomes the place where the strategy is discussed and its implementation shown (D43–D52).
- date: "30 Sep 2026"
  strand: platform
  title: The family tree joins Heritage
  text: The tree moves from the roots beneath all four branches onto the Heritage branch, beside the Preservation Project, the magazine and the bookstore. Every member keeps a node on it (D53).
- date: "Oct 2026"
  strand: platform
  title: The Federation's working files read
  text: Four folders, about 900 documents, read through the intake process; fourteen decisions (D54–D67) and nineteen questions followed.
- date: "1 Oct 2026"
  strand: platform
  title: The club experience plan
  text: 'Design note P18 written in fourteen sprints: the people of a club, the officer year, the club statement, the club''s seat in each programme, the move from Breeze club by club, and a page for club presidents; questions Q-40 to Q-47 raised.'
- date: "1 Oct 2026"
  strand: platform
  title: Breeze read in depth
  text: 'About a hundred and ninety support articles, the API and the vendor''s terms read through the intake process: no membership object, a printed and unchecked child-pickup code, an export without attendance, an unsupported API held by each club''s account owner, texting from a shared short code. The club plan, the migration workflow and the Hub''s slices adjusted (Breeze Parity §1a).'
- date: "1 Oct 2026"
  strand: platform
  title: The directory in three formats
  text: 'Design note P19: the members'' directory with membership and club shown at Federation and club scale, the professional services directory, and the leadership directory of seats and their votes; all behind sign-in, nothing printed; Q-48 and Q-49 raised.'
- date: "1 Oct 2026"
  strand: platform
  title: The club journeys
  text: 'Design note P20: fifty-two tests of the clubs component, each starting from what a club officer does in Breeze today and ending in the rule tested, the refusal expected and the slice that builds it.'
- date: "1 Oct 2026"
  strand: platform
  title: The sixteen remaining design notes written
  text: 'P1 to P9 and P11 to P17 written and cross-checked against each other in one day: the committee workspace, the planning survey, letters, family referral, the Selection Committee, press, volunteers, Mid-Year bids, the fund rules, Care grants and partners, the selection programmes and the Arabic term, host agreements, advocacy, incident response and retention, the Executive Director, AFRPWorks. Seventy-seven slice rows and questions Q-50 to Q-157 followed; the design record is now readable on the site.'
