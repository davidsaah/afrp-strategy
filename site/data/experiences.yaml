- key: club-president
  name: Club president
  lens: club
  who: The president of a chapter club, who files the officers each year, sits on the Council of Chapter Club Presidents and
    the Federation Board, and brings the delegation to the Convention.
  needs:
  - Know the club is affiliated and in good standing for the year
  - File the officers once and have every Federation list read from it
  - See the club's health as the Federation will see it
  - Bring the delegation to the Convention credentialed
  - Bid to host a Mid-Year or a Convention
  - Present the club's Mid-Year bid at the previous Mid-Year, as the Mid-Year guideline asks (Q-92)
  - File the club's by-laws, state entity and federal subsection with the office and have receipt acknowledged (By-Law 3.1;
    Q-227)
  - Reconcile a hosted Convention at the close meeting with the Deputy President (in practice, research 2 Oct 2026)
  platform:
  - One officers form a year, started from last year's, which is the By-Law 3.2 filing and the source of the Council, Board
    and Membership Committee seats that derive from it
  - A standing pill for the club (affiliated for the year, filed on, approved on)
  - The club dashboard as the first screen (roster counts, dues position, open follow-ups, next events, the club-share balance)
  - The delegation selected from certified members (By-Laws 9.1.3, 9.1.4) and handed to the convention workflow
  - The host-bid form and the host agreement on the event (D59)
  - The delegation recorded as the club's dated act with its method and evidence (P22 §6; Q-37)
  - The host's confirmation of the corrected settlement statement on the club lens, or a query that holds that line only (P22
    §9)
  - 'The award: a region whose bids all fail the tests reads ''no qualified bid'', and the turn passes only by the Assembly''s
    dated act (P22 §3.1; Q-240)'
  privacy:
  - The president must be in good standing of club and Federation, because every compliant president sits on the Board (By-Laws
    6.2.2, 6.2.3, 4.3.1); the president's seat is refused to a lapsed member by name; other seats follow the club's own laws
    (3.1) and are shown, not refused
  - The president reads the whole club and nothing of any other club
  - The officers' contact details on the form are the office's and the Council's, never the directory's (R27)
  - A club's own membership rule wider than By-Law 4.1.1 leaves the conjunctive standing test unwritten for those members
    (Q-226)
