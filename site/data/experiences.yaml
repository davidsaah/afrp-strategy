- key: visitor
  name: Visitor
  lens: door
  who: 'Someone not signed in: a prospective member, a relative or a member of the public reading about AFRP. Also a non-member
    the platform holds as a contact (a learner, applicant, subscriber, candidate or giver), who signs in with a verified channel
    to see only their own record (P21 §4).'
  needs:
  - Understand what AFRP and its programmes are
  - Find a way to join
  - Browse the bookstore and reach the public giving door without signing in
  - Register for an Arabic class at the public rate without joining (D60)
  - Know before checkout that the stores ship only to US addresses
  - 'As a non-member contact, see my own record: each role, its scope, source and date, its consent rows, and a withdrawal
    for each (P21 §4)'
  - Apply to a second programme on the same channel and be asked to sign in, so the new role joins my one record (P21 §7.1)
  - Offer my time to the Medical Mission and be answered by the office (in practice, research 2 Oct 2026; Q-87)
  - Read a back issue of the magazine signed out, with no page naming a living person (P24 §7)
  platform:
  - Public site and programme pages from the programme register
  - One front door to join or sign in
  - Public job postings with complete markup
  - The Arabic class door at the public rate (D60); the public page still says members only (Q-171)
  - Two online stores today, on the website and the member portal, with the same titles and no member price (in practice,
    research 2 Oct 2026) (Q-197)
  - One person record with dated roles for every non-member the platform holds; no role is a membership, a directory row,
    a tree node or a count as a member (P21 §3; D60)
  - Operational messages about my own transaction only; a next-term or next-cycle invitation waits on Q-70 and is not asked
    for at the door (P21 §8)
  - The shipping rule is a catalogue parameter shown on the catalogue page before the cart; while it is unset, checkout refuses
    and names Q-197 (P24 §8.2)
  - 'A purchase is never a gift: no product, order or receipt carries a deductibility statement (P24 §8.2; UC-11)'
  privacy:
  - Nothing about living people shows without sign-in (D28)
  - Sign-in and recovery are existence-blind
  - Living people in the public build are synthetic (D15)
  - A role is read only in its owning scope; one programme's consent row is never offered to another programme's audience
    (P21 §5, §8)
  - No consent row is created by a migration; an imported occupation or date of birth is not loaded onto the person (P21 §7.5)
  - Withdrawing a role closes it at once; its fields wait for a retention clock that has no value yet, so nothing is deleted
    (P21 §9)
  - A door whose person does not attest to being an adult creates no contact (R7; P21 §3)
  - Signed out, a tree plate shows the deceased in full and nothing about the living (D28; P28 §5)
  - An oral-history narrator who withdraws is removed from every platform surface the same day; a printed page cannot be recalled
    and the consent screen says so (P27 §6)
