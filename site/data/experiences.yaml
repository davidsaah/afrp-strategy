- key: federation-staff
  name: Federation staff and officers
  lens: federation
  who: National officers and staff running membership, money, governance and the registries. Includes the Executive Administrator,
    who keeps the books and writes the cheques, the General Fund and Educational Fund treasurers, the programme director and
    the paid congressional-outreach coordinators.
  needs:
  - Know whether the federation is healthy and governed properly
  - Close the books
  - Run elections and the convention
  - 'Educational Fund Treasurer: file the Education Fund, Relief Fund and Cook Book statements to every Board meeting from
    the ledger (Q-174)'
  - 'Executive Administrator: prepare the Convention reconciliation and record the payment the General Treasurer makes, clearing
    the liability (Q-221, Q-222, Q-241)'
  - 'Executive Administrator: cut a scholarship cheque only after verification, from the account that should pay it (Q-158)'
  - 'Executive Administrator: record a Relief Fund transfer and the onward wire as one linked act'
  - 'General Fund Treasurer: settle each affiliate''s ''due to'' balance on a known cadence (Q-232)'
  - 'Committee chairs: budget-versus-actual for their line without the organisation''s full statements (in practice, research
    2 Oct 2026)'
  - 'Run the Convention desk: check in delegates and members, print badges, take walk-ins through the door (P22 §5.4)'
  - 'Record the close''s acts: the reconciliation meeting''s corrections, the approval and the payment with its signatories
    by seat and its channel (P22 §9; Q-241)'
  - 'Educational Fund Treasurer: file the Relief Fund''s statement from the ledger once its entity is named, and until then
    link the paper statement and say why (P23 §6; Q-174)'
  - 'Executive Administrator: record a Relief Fund transfer and its wire as one act with two legs (P23 §4.4)'
  platform:
  - Dashboard, Member 360 and the merge queue
  - Daily close and remittance runs
  - Elections console, floor and ruleset workbench
  - One card-processing account per entity, with each payment naming its entity's processor profile (in practice, research
    2 Oct 2026)
  - The settlement statement with netted items and the payment channel (Q-221, Q-222)
  - Member 360 shows a contact's roles by kind, scope, date, state and consent state and none of their fields without that
    role's scope; the Executive Director's 7.9.3 read is a named-purpose act with an audit line (P21 §5; P16 §3.2; Q-44)
  - 'The merge queue for contacts: two contact records for one person land in the review band and a human decides; a merge
    is reversible (P21 §7.3)'
  - 'The Convention books mapping: bookkeeper-typed rows; a Convention line mapped to ARFECF is refused (D1 G; P22 §10; Q-224)'
  - The Relief Fund row, held by AFRP (D83), and its three paths with authoriser rows; a path-3 transfer with no approval act refuses (P23 §3,
    §4; Q-109)
  - The Young Leader Board seat as a register row with "no appointing text" (P25 §4)
  privacy:
  - 'Sensitive permissions need an exact-scope grant: PII read, export, unseal, post, grant'
  - 'Deleting a person never happens: closed as merged or deceased'
  - Federation scope does not read the ARFHSN store (R39)
  - Four roles answer to 'the CPA'; the record names which per question (Q-231)
  - A relief payment carries counts and totals, never recipients (P11 §4)
  - Staff applicants stay outside the platform; only the outcome is recorded (P16)
  - Every contact role other than the learner refuses by name until Q-70 is answered (P21 §2, slice CR1)
  - 'Retention not set: nothing deleted, and every screen that reads a silent row says so (P21 §9; P15 §3)'
  - No node, person or archive item is sent to an outside site by any endpoint, export or feed (P27 §7)
