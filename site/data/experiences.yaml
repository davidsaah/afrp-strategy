- key: committee-member
  name: Committee member
  lens: federation
  who: A member serving on a committee such as the Family Tree, Scholarship or Membership Committee. Also a clan steward the
    Family Tree Committee appoints, who pre-reviews and recommends for one clan and never approves (D72; Q-263).
  needs:
  - A queue of decisions with evidence
  - Conflicts disclosed on the record
  - Authority that is theirs alone where the by-laws say so
  - 'Women to Women: approve a project and see its receipts against it (Q-114)'
  - 'ARFHSN board: dispose of each funding request one of four ways with a date (Q-217)'
  - 'Scholarship Committee: assign a named scholarship under its donor''s criteria (Q-102)'
  - 'Family Tree Committee: see the change-request form''s rows in the queue rather than in one person''s inbox (D14). *Since
    2 October 2026:* the form''s rows are not imported; members propose in the platform and earlier requests arrive through
    the record keeper''s export, labelled as made outside the queue (P27 §4.3; D70)'
  - 'Family Tree Committee: run the parallel run by dated acts, decide each conflict, and see the nightly backup row (D69;
    P28 §4.3)'
  - 'Clan steward: annotate and recommend accept, decline or needs information for my clan, and apply nothing (D72)'
  - 'Convention Innovation Committee: keep a sponsor-prospect list by region with who is working each prospect, and enter
    past Conventions as attested history rows (P22 §7.2, §11; Q-245)'
  - 'Scholarship Committee: suspend or cancel an award only by a decision item with the seats present, and reconcile the named-scholarship
    list to instruments (P26 §2.4, §5)'
  platform:
  - The tree committee queue, triaged; one approval applies an own-household life event or a non-structural correction, and
    a structural change needs a second key from a different committee member (D72; P28 §4.2)
  - Scholarship review with median ranking
  - Open questions routed by name (R40)
  - Their seat on the leadership directory, with its dates, whether it votes, and a seat channel instead of personal contact
    details (P19)
  - The Care grant record with its ceiling, two signatories and three closing records (D63)
  - The steward's pre-review on the clan's queue; the structural kinds read from the rules-register row
    D81 set, which the committee may amend by a dated act (P28 §4.2, §6)
  - 'The conflict list during D69''s parallel run: a change made on both sides since the last export is held with both readings;
    after the run an external import is refused naming D69 (P28 §4.3)'
  - A nightly GEDCOM backup under tree:moderate, each night a dated row and a failed night shown on the console (D69)
  - 'The custody page: licence holder and account shown as the Federation (D87), the cadence "not stated" until the committee''s act, the last export imported against
    the cadence, and the queue''s counts (P27 §3, §4.4)'
  - 'The Young Leader Committee as the text reads: five seats, the sixth refused naming the 8.10 paragraph and Q-179 (P25
    §4)'
  - The Scholarship Committee's seats as the 2015 policy reads; a "Foundation representative" seat refused naming D58; an
    attendee without a seat in no tally (P26 §3.1)
  privacy:
  - Refusals name the rule, not the relatives (S6)
  - A declined invitation is never visible to a committee
  - Fund committees hold exclusive expenditure authority
  - 'Applicant data for Women to Women''s tuition awards: its class and holder are not stated (Q-211)'
  - Who approves a Women to Women project is open between the committee and ARFHSN's Board (Q-114)
  - The same committee member cannot give both keys on a structural change; the second key-holder is a committee member the committee seats (D72, D79)
  - A steward recommends and never applies (D72)
