- key: club-officer
  name: Club officer
  lens: club
  who: A president, secretary or other officer of one chapter club.
  needs:
  - Know who their people are and whether the club is healthy
  - Reach members lawfully
  - Run meetings, events and the officer year
  - Keep the roster true as people join, lapse, move house or move clubs
  - Run a local action committee's meetings with officials and report them (Q-131)
  - Report the club's direct gift to a Ramallah project so that it is counted beside the Federation's charities (Q-228)
  - 'Hold the club''s legal details on the register: state entity, federal subsection, any sister foundation (Q-227)'
  - Hold the club's own prospects, referrals and event guests as the club's roles, and nothing else of anyone (P21 §10)
  - Raise money for the Relief Fund as gifts to the fund's purpose with the club's attribution, through headquarters (By-Laws
    11.1.4, 11.1.5; P23 §5); a club's own Ramallah project is Q-228
  - As the host club's coordinator, print badges and read sub-event rosters and counts by club at the desk without a guest-list
    export (P22 §8; Q-127)
  platform:
  - Roster with national and club status side by side
  - The members' directory filtered to the club, which shows only consenting members; the roster shows all and never leaves
    the club lens
  - Groups, follow-ups and club events with check-in
  - The acting panel on any filtered set (mail it, group it, follow it up)
  - The secretary's queue of things that need a person (a join naming this club, a household split, a move between clubs,
    a reported death)
  - A lapse raises a follow-up only if the club switched that rule on, and names the rule
  - Federation context as counts
  - A club member admitted under the club's own wider rule shows club standing only; how is not yet written (Q-226)
  - The Program Director's summary of each club's priorities after the presidents' meeting (in practice, research 2 Oct 2026)
  - 'The club''s own contact roles: a prospect in the secretary''s queue once the person has acted on the club''s invitation;
    referrals as a count until the person consents; the club''s event guests under the organiser seat, with no export (P21
    §10; Q-72)'
  - A relief drive across the clubs is one catalogue purpose with an end date and a tally of attributions per club; it cannot
    publish until its receiving row has an entity (P23 §5; Q-180)
  - 'The host coordinator''s scoped grant on the event: badges and QR codes produced by the platform from the registration
    (P22 §5.4, §8; P13 §2.4)'
  privacy:
  - A club officer cannot read another club's roster
  - Bulk export refuses the officer as it refuses everyone
  - Club and programme scopes are siblings; neither implies the other
  - A follow-up is a task about a person, closed and never deleted; there is no free-text note on a person anywhere in the
    club lens except a follow-up's one completion note
  - Minutes and club documents stay on the drive, the archive of record (D66); the platform links to them
  - Today the president's view and the host coordinator's export show members' names and contact details; the record's counts-only
    and per-field-consent rules narrow both (Q-237, Q-127)
  - A club never sees another club's contacts, any programme's roles, or a contact's channels outside its own roles; a learner
    or subscriber is never named to a club (P21 §10)
  - A Breeze profile of a non-member enters as a staging row with no consent row (P21 §7.5)
  - A drive's gifts are the fund's, counted on the club's statement and never the club's money (P23 §5; D57)
