- key: scholar
  name: Scholar
  lens: member
  who: A Scholarship recipient, new or continuing, on the undergraduate or medical track in the United States or Ramallah,
    whose award is paid in instalments.
  needs:
  - Know what to file after each semester to have the next instalment released
  - Know what happens after a bereavement or a hardship before the payment is late
  - Receive the award letter and the first cheque without chasing
  - See on my own page each instalment's state, what is still missing for the next one and the date the office received each
    item (P26 §2.2)
  - Ask for hardship by category and have the account I give stay outside the platform (P26 §2.4)
  platform:
  - A semester filing (transcript, full-time enrolment with the next schedule, cumulative GPA) checked by the office before
    release (in practice, research 2 Oct 2026) (Q-159)
  - A missing-documents letter that says what is missing and by when (in practice, research 2 Oct 2026)
  - A free student membership on award (J06 step 6)
  - 'Instalment states: scheduled, due, verified, released, held, suspended, cancelled; three verification rows per instalment,
    each a dated act with no content; release once all three are recorded (P26 §2.1–§2.3)'
  - A missed filing holds the instalment and never lapses it; only the committee's act suspends or cancels, and the window
    that turns due into held has no value until Q-256 sets it (P26 §2.4)
  - Letters on P3's register in ARFECF's name; a letter row with no signatory is a draft the office sees and is not sent (P26
    §4; Q-158)
  privacy:
  - Applicant material never enters the Hub; the platform records references only (scholarship spec)
  - Recipients' names are never published; counts and amounts by track are (in practice, research 2 Oct 2026)
  - A named scholarship's donor sees which award carries the name, by count, never the scholar (Q-102)
  - Relationships the tree sees are disclosed with their degree on review (D16)
  - No transcript, schedule or GPA figure enters the platform; the verification row records only that the item is on file
    (P26 §2.2; D61)
  - An instalment is seen only by the scholar, the office's seat, the committee's seats and the fund's treasurer (P26 §2.2;
    R39)
