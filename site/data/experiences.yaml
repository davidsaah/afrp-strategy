    a member present votes in person with the vote deducted from a delegate''s total (in practice, research 2 Oct 2026) (Q-37)'
  - 'Presence at the desk: only a present delegate carries a weight and only a present certified member may extract; the weight
    is certified members over present delegates, computed, never typed (P22 §6''s reading of 9.1.3''s ''delegates sent''; Q-37; D5)'
  - The delegation as a dated act of the club with its method stated (officers' selection, members' vote, or the club's own
    by-laws), the weights computed the same way whatever the method (P22 §6; Q-37)
  - 'The Convention city: one qualified bid by voice or hands (9.1.2); two by a weighted delegate vote (9.1.1(2)) (P22 §3,
    §6)'
