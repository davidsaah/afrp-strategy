- key: new-member
  name: New member
  lens: door
  who: A person joining for the first time, alone, as a family, as a student or as a newlywed.
  needs:
  - A join that cannot be captured by a mistyped email
  - Clear dues and what they buy
  - A first login that says what to set up next
  - Find myself on the family tree at join or renewal, or skip the step, and have either be a complete answer (D73)
  - Join after an Arabic class or an application on the same channel and keep that history (P21 §7.2)
  platform:
  - Channel verification before any payment or PII (S1)
  - A tree node on join, never a lineage claim (D30)
  - The Associate route offered where the genealogy cannot reach
  - A first contact through an Arabic class counted when the learner later joins; some learners joined this way (in practice,
    research 2 Oct 2026)
  - 'A ''Find yourself on the family tree'' step at join and renewal: search by own name or the oldest ancestor I can name;
    candidates shown, the platform never picks; a link proposal queues and the node stays unattached meanwhile (D73; P28 §4.4)'
  - A contact who joins confirms the record is theirs; the membership is added, each role and its consents carry over unchanged,
    and no role consent becomes a member consent (P21 §7.2)
  - A walk-in at the Convention desk who is not in standing is offered dues and registration in one payment as separate lines
    (P22 §5.4)
  privacy:
  - Consent at join is per field with its source recorded
  - A minor's consent is held by the household and re-asked at eighteen
  - No password can exist
  - Today's registration system makes a vetted account with a profile before any membership or consent; the platform's contact
    record is narrower (D60; Q-70)
  - No membership decision reads the tree node (D30, D73)
  - A staff seat cannot link a contact to a member on a name match without the person's confirmation (P21 §7.2)
