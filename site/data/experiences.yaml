- key: member
  name: Member
  lens: member
  who: A signed-in member with a national membership and usually one or more club memberships.
  needs:
  - See each membership's standing and date
  - Renew, give, register and vote
  - Control what others see
  - Register for the Day of Action by one published deadline, free as an adult member, with first-timer costs covered (in
    practice, research 2 Oct 2026)
  - Send a wedding, birth, graduation or obituary once and have it reach the tree and the magazine
  - Propose a family-tree change while in current national standing and track it (D70), and ask for clan-book access and be
    told the test (Q-200)
  - Take the action a town hall asks for and contact my representative (Q-133)
  - See my own plate in the book's grammar, my living relatives in full inside my own branch (D68, D71)
  - 'See my own path: my programme alumni records, interests and seats in date order, with programmes I have not taken part
    in as links, never as a next step (P25 §3; D39)'
  - Apply for a sponsored Arabic-class place with a short statement and hear the outcome before registration closes (in practice,
    research 2 Oct 2026; Q-168)
  - Register for an RBPN speaker event and be reminded (Q-181)
  - Submit a photograph or document with its consent class and a credit, linked to a tree node, through the platform (D66;
    D22; P27 §6.4)
  - Read the digital issue on the platform rather than from an email link (Q-196)
  - As a family, submit an obituary with its tribute and pay the placement, approved through the family contact (R34; P24
    §3.3; Q-193)
  - Register a guest for the Convention as a name and a credential class, not a contact (P21 §4; Q-238)
  - Forward a relative's late scholarship application and be told the rule (Q-117; Q-257)
  platform:
  - Home with an attention list and two standing pills
  - 'Scoped standing: national and club lapse independently'
  - Ballots with the reason when ineligible
  - My branches and the next step on each
  - The directory in three formats, signed in: members with membership and club shown, professional services, and the leadership
      seats with their votes (design note P19)
  - A registration door for programmes that take registration rather than applications (the Day of Action in 2026; Q-115)
  - The change-request form's rows land in the Family Tree Committee's queue (D14). *Since 2 October 2026:* the form's rows
    are not imported; a member proposes in the platform and requests already sent by form arrive through the record keeper's
    next export (P27 §4.3; D70)
  - 'The plate: one plate per tree, a trunk to the founder, each limb carrying its grade, the continuation marks opening in
    place at phone width (D68; P28 §3). *Since 3 October 2026:* the plate is the default view on every surface and the
    hourglass stays available as an alternative view (D77), drawn in the plate grammar (D80)'
  - 'Edit mode on a plate: add a child or a spouse, correct a name or date, record a death, attach a source, flag a duplicate
    or propose a parent; submit the sitting as one bundle and track it as pending, needs information, accepted or declined,
    with the committee''s reason (D70, D21; P28 §4.1)'
  - Archive items linked to a deceased person's node show on that person's page to signed-in members, each under its consent
    row (P27 §7.2)
  - The path view of one's own record, seen by nobody else (P25 §3; slice YL1)
  - 'The unified Convention registration: a banquet seat from the sub-event''s capacity, refunds under terms published before
    opening, dues paid with registration standing for the year (P22 §5)'
  - A graduation is an announcement on my record, printed only with my print consent; a correspondent's entry is pending until
    I confirm it once (P24 §3.1, §3.2)
  - An appeal reaches me on the channel I consented to, never chosen by my age (P24 §5.5)
  privacy:
  - Display, contact and export are three separate consents (R27)
  - A declined invitation is recorded nowhere a committee can see
  - All members see the whole tree, a recorded choice (D17). *Since 2 October 2026:* a member sees the living in full only
    inside their own branch and their spouses (out to third cousins, a common great-great-grandparent; D76), and outside it a name and a position on
    the plate (D71; P28 §5)
  - A constituent story or a town-hall action is not a member record until consent and retention are stated (Q-184, Q-133)
  - Outreach by a profile field such as occupation waits on consent rows (Q-236)
  - Clan-book access follows D17 (now D71) and D28, not a personal approval; a book carrying living details is not offered
    by standing (P27 §5; Q-200, Q-202)
  - Own branch runs along blood links only; a step or adoptive link never widens it (D71; P28 §5). Whether relatives inside
    it see minors' dates is Q-268
  - A lapsed member cannot propose a tree change; no account exists for a non-member to contribute (D70)
  - No plate, sheet or search result says whether a person is a member (D30; P28 §3.2)
  - No member-facing export of the tree exists; the nightly backup is the committee's (D69)
  - The path view is mine alone; a committee sees only what its own scope already shows (P25 §3)
