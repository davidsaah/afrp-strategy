- key: "scholarship"
  name: "Scholarship"
  branch: "education"
  order: 4
  entity: "ARFECF (Decision 3; D55): the Scholarship Fund. afrp.org says the scholarship was established by the Ramallah Foundation and is run jointly with AFRP; the record follows the decisions."
  shape: "Award"
  flagship: true
  status: "Built"
  summary: "Financial support for college students of Ramallah descent on two tracks, in the US and in Ramallah, each with a fixed annual amount: up to four years of undergraduate support, extended through graduation for medical students, with named scholarships alongside the general fund."
  who: "Students with direct lineage to the original Ramallah families, or sponsorship and approval; full-time at an accredited college; documented financial need; minimum 3.0 GPA. Two tracks, US and Ramallah. In practice one sibling per family is accepted, as a note in the selection workbook, not a written rule."
  year: "1 December: applications open. 31 May: deadline. Summer: review and vote. After the Convention: decisions (letters went out in early September in 2026). Each year: continuing recipients are carried as a cohort, with renewal reports (design/AFRP-Scholarship-Program-Spec.md) and the follow-up on academic standing the 2015 policy requires."
  rungs:
    hear: "The household of a student in their final school years is told; lineage is checked once, through the family tree, and reused."
    show_up: "An application. Trying is showing up, and the applicant can see what has been received and what is missing."
    take_part: "A continuing recipient, renewed each year; a missed renewal after a bereavement is not lapsed by silence."
    give_serve: "Giving back, from an alumni gift to a named scholarship; service and money rank the same."
    lead: "A seat on the Scholarship Committee, where conflicts with relatives are disclosed on the record."
  organiser: "The Scholarship Fund Committee under ARFECF, seated as the 2015 policy reads: a chairman chosen by the ARFECF President, the executive director, members chosen by the ARFECF Board and three members elected at the Annual Convention (D58). Ramallah Foundation seats exist only once the ARFECF Board amends the 2015 policy (D58). The committee approves and distributes the annual expenditure (2015 policy; By-Law 6.4.4); no designated officer may stand in for it."
  money: "ARFECF's Scholarship Fund, on ARFECF's books with ARFECF's receipts. The by-laws limit spending to 5%; the 2015 Scholarship Fund Policy Statement makes 4% to scholarships plus 1% to AFRP mandatory, which together equal that limit. Who may waive or carry over is open (Q-35)."
  handoffs: "Fed by lineage on the family tree and formerly by the HS Senior Award. Recipients get a free student membership and feed Project Hope, Leadership Ramallah, RBPN and the alumni programme."
  strategy_needs:
  - "Scholarships (2019 plan)"
  - "Part of the youth pipeline from childhood to professional life (2019 plan)"
  - "Recruit 21-35 year-olds; programme alumni events at the Convention (2023 minutes)"
  - "A named scholarship, a larger endowment, a review of how scholarships are given, and outreach to past recipients (Scholarship committee overview, 2026)"
  platform_needs:
  - "JP-020: the Scholarship Fund Policy Statement (2015) is found; it makes 4% plus 1% mandatory, equal to the 5% limit (design/bylaws/ARFECF-2015-and-the-fund-policies.md). Who may waive or carry over stays open (Q-35)"
  - "JP-021: the members' vote for Scholarship Committee seats has its basis in the 2015 policy's three elected seats (D58); the AFRP by-laws should still name what they elect"
  - "Seat the committee as the 2015 policy reads; Foundation seats only after the policy is amended (D58)"
  - "The ARFECF determination letter, needed for a receipt's exempt-status claim (Q-2)"
  - "Past recipients only, as alumni records through the match queue (slice 9); applicant data and documents never enter (binding rule 2, D61)"
  - "The application guidelines the 2015 policy requires are not found; the screen cannot cite them"
  questions:
