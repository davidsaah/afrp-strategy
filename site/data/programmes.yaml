  summary: "A two-day summit for young Palestinian-American adults, held alongside the Mid-Year Meeting, with expert-led workshops on leadership, advocacy and cultural preservation, a case-study lab, a pitch competition and a career panel."
  who: "Active AFRP members aged 21 and over (with occasional flexibility); about 15 places. Standing is By-Law 4.3.1 in full: national and club dues both current; accepted participants must be current by a stated deadline or lose the place (acceptance letters, 2024)."
