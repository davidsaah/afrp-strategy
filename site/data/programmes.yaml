- key: "scholarship"
  name: "Scholarship"
  branch: "education"
  order: 4
  entity: "ARFECF (Decision 3; D55): the Scholarship Fund. afrp.org says the scholarship was established by the Ramallah Foundation and is run jointly with AFRP; the record follows the decisions. In practice (research, 2 Oct 2026): afrp.org says the programme is managed by the Ramallah Foundation; the Foundation is a private foundation on its own public filing (Form 990-PF); see Q-162."
  shape: "Award"
  flagship: true
  status: "Built"
  summary: "Financial support for college students of Ramallah descent on two tracks, in the US and in Ramallah, each with a fixed annual amount: up to four years of undergraduate support, extended through graduation for medical students, with named scholarships alongside the general fund."
  who: "Students with direct lineage to the original Ramallah families, or sponsorship and approval; full-time at an accredited college; documented financial need; minimum 3.0 GPA. Two tracks, US and Ramallah. In practice one sibling per family is accepted, as a note in the selection workbook, not a written rule. afrp.org adds 'or committee sponsorship approved by the Board' in place of lineage (Q-160) and on-time submission of applications and reports. No 2026 source mentions the one-sibling note."
  year: "1 December: applications open. 31 May: deadline. End of May to June: the office compiles the continuing cohort with its status, and the committee secretary filters the form's responses into one review sheet. Mid-July: one review meeting after reading in advance, deciding by consensus. Late August: the secretary reports the recommendations to the Board and the President. Early September: the programme director verifies documents; the office writes cheques and posts award, missing-documents and rejection letters (2026). After the fall and winter semesters: each continuing recipient's next instalment is released on verification (award letter, 2026; Q-159). Renewal reports (design/AFRP-Scholarship-Program-Spec.md) and the follow-up on academic standing the 2015 policy requires."
  rungs:
    hear: "The household of a student in their final school years is told; lineage is checked once, through the family tree, and reused."
    show_up: "An application. Trying is showing up, and the applicant can see what has been received and what is missing."
    take_part: "A continuing recipient, renewed each year; a missed renewal after a bereavement is not lapsed by silence. In practice (research, 2 Oct 2026): the 2026 award letter says failure to file may result in suspension and asks the recipient to contact the office on hardship; neither reading is a written policy; see Q-159."
    give_serve: "Giving back, from an alumni gift to a named scholarship; service and money rank the same."
    lead: "A seat on the Scholarship Committee, where conflicts with relatives are disclosed on the record."
  organiser: "The Scholarship Fund Committee under ARFECF, seated as the 2015 policy reads: a chairman chosen by the ARFECF President, the executive director, members chosen by the ARFECF Board and three members elected at the Annual Convention (D58). Ramallah Foundation seats exist only once the ARFECF Board amends the 2015 policy (D58). The committee approves and distributes the annual expenditure (2015 policy; By-Law 6.4.4); no designated officer may stand in for it. In practice (research, 2 Oct 2026): the 2026 committee counted Foundation representatives as votes; the committee secretary runs the cycle and reports to the Board and the President; the programme director verifies documents and announces counts; the Executive Administrator keeps the cohort list and writes the cheques; see Q-161 and D58. The committee's seats, Foundation seats included, are read in P26 §3.1 (D58)."
  money: "ARFECF's Scholarship Fund, on ARFECF's books with ARFECF's receipts. The by-laws limit spending to 5%; the 2015 Scholarship Fund Policy Statement makes 4% to scholarships plus 1% to AFRP mandatory, which together equal that limit. Who may waive or carry over is open (Q-35). In practice (research, 2 Oct 2026): the US-track award is paid by cheque in two instalments a year, each released after the office verifies the semester transcript, full-time enrolment for the next semester and the minimum cumulative GPA; the letters go out in AFRP's name over the President's and the committee secretary's signatures, and which account the cheques draw on is not shown; see Q-158. The Ramallah track's channel is still not stated. The release and disbursement are designed in P26 §2.3; the Cook Book fund beside it in §6.2."
  handoffs: "Fed by lineage on the family tree and by the HS Senior Award, which continues (D82). Recipients get a free student membership and feed Project Hope, Leadership Ramallah, RBPN and the alumni programme."
  strategy_needs:
  - "Scholarships (2019 plan)"
  - "Part of the youth pipeline from childhood to professional life (2019 plan)"
  - "Recruit 21-35 year-olds; programme alumni events at the Convention (2023 minutes)"
  - "A named scholarship, a larger endowment, a review of how scholarships are given, and outreach to past recipients (Scholarship committee overview, 2026)"
  - "Reconciling the named scholarships, the committee's priority for the year (committee report, August 2026)"
  platform_needs:
  - "JP-020: the Scholarship Fund Policy Statement (2015) is found; it makes 4% plus 1% mandatory, equal to the 5% limit (design/bylaws/ARFECF-2015-and-the-fund-policies.md). Who may waive or carry over stays open (Q-35)"
  - "JP-021: the members' vote for Scholarship Committee seats has its basis in the 2015 policy's three elected seats (D58); the AFRP by-laws should still name what they elect"
  - "Seat the committee as the 2015 policy reads; Foundation seats only after the policy is amended (D58)"
  - "The ARFECF determination letter, needed for a receipt's exempt-status claim (Q-2)"
  - "Past recipients only, as alumni records through the match queue (slice 9); applicant data and documents never enter (binding rule 2, D61)"
  - "The application guidelines the 2015 policy requires are not found; the screen cannot cite them"
  - "A semester renewal check per continuing recipient (transcript, enrolment, GPA) that releases the next instalment, once the rule is adopted (Q-159)"
  - "Named scholarships as sub-funds only once each has an instrument and an assignment rule (Q-102)"
  - "Designed in P26 (`AFRP-Scholarship-Awards.md`, SA1–SA7): the instalment, the semester filing and its verification, the release, the hold, the committee's acts, the letters and named scholarships"
  questions:
  - "Who is the tax adviser who clears flagged disbursements?"
  - "In practice the committee votes by initials in a selection workbook; what is the written rubric, and how many reviewers per application?"
  - "Named scholarships: about twenty are on the office's list, reconstructed from the Educational Secretary's reports of the 1990s; none has an instrument, criteria or assignment rule on file, and the public site publishes a minimum gift and term for a new one (Q-102)"
  - "Does the free student membership have an age or enrolment limit?"
  - "Is one sibling per family a rule or a note? No 2026 source mentions it"
  - "How are Ramallah-track awards paid (channel, currency, payee)?"
  - "Who approves the budget: answered by the 2015 policy and By-Law 6.4.4 (the committee). Foundation seats: answered by D58, conditional on the ARFECF Board"
  - "Which account pays scholarship cheques, and in whose name the award letters go: ARFECF's fund or AFRP's? (Q-158)"
  - "Is the renewal rule in the 2026 award letter the committee's adopted policy, and what is the hardship exception? (Q-159)"
  - "Is 'committee sponsorship approved by the Board' a real lineage exception, and which Board? (Q-160)"
  - "Does the Board approve the year's scholarships (2023 report) or receive the committee's decision (By-Law 6.4.4)? (Q-161)"
  - "The public site says the programme is managed by the Ramallah Foundation; which statement is right under D3 and D55? (Q-162)"
  - "A late or absent application is treated as disqualifying (June 2026); no written rule exists (Q-117)"
  - "The Scholarship's Ramallah track (P26 §2.1; Q-255)"
  - "Renewal parameters the award letter does not reach (P26 §2.2, §2.4; Q-256)"
  - "An appeal route for a declined, suspended or cancelled scholar (P26 §2.4; Q-257)"
