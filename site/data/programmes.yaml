- key: "arabic-program"
  name: "Arabic Program"
  branch: "education"
  order: 2
  entity: "ARFECF (D55): budgeted in the Educational Fund for 2026–27. Pending confirmation by the AFRP and ARFECF Boards."
  shape: "Cohort"
  flagship: false
  status: "Plan only"
  summary: "Weekly online Arabic classes for adults, taught by a partner teaching college: a Conversational track in the Palestinian dialect and a Traditional reading, writing and speaking track. It runs today outside the Hub, through My AFRP and the CRM."
  who: "Adult learners. Members pay the member rate; a person who is not a member may register at the public rate, with a contact record and not a membership (D60). On the Education branch it is the one rung open at any adult age."
  year: "Three terms a year: a fall term from September, a spring term from January, each of 12 weekly online sessions (Thanksgiving or Easter week off), and a short summer enrichment term. A priority window for past students and waitlisted learners opens each term before general registration (Arabic committee records, 2025–2026)."
  organiser: "The Arabic Program Committee, a standing committee joined through the Committee Interest Form, with the Federation's programme director. The partner college supplies the teachers. What it escalates is not stated."
  money: "ARFECF's Educational Fund (D55): class fees as income and the teaching partner's cost as expense in the approved budget. The partner invoices the Federation per enrolled seat, plus books. Where last year's surplus is held is an open action for the committee. Figures are not given here."
  handoffs: "Open at any age, so no milestone invitation fires into it. The prototype links it to Camp, the Preservation Project and the magazine's Arabic pages. Club presidents recruit its volunteer conversation partners (August 2026)."
  strategy_needs:
  - "Arabic classes named a refresh priority by the Strategic Planning Committee (2026)"
  - "A one-page plan for expansion in January 2027 (Arabic committee, August 2026)"
  platform_needs:
  - "Only a page, charter and plan exist in the Hub; registration runs today in My AFRP and the CRM"
  - "An extra station for term calendar and enrolment caps (Deep Programs)"
  - "A non-member purchase at the public rate, keeping a contact record and not a membership: a new caller of the one payment door, for the arabic-term design note (D60)"
  - "Pay the teaching partner per seat from the fund that holds the programme (D55)"
  questions:
  - "Non-members: answered by D60"
