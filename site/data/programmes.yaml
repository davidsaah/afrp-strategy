- key: "arabic-program"
  name: "Arabic Program"
  branch: "education"
  order: 2
  entity: "ARFECF (D55): budgeted in the Educational Fund for 2026–27. Pending confirmation by the AFRP and ARFECF Boards."
  shape: "Cohort"
  flagship: false
  status: "Plan only"
  summary: "Weekly online Arabic classes for adults, taught by a partner teaching college: a Conversational track in the Palestinian dialect and a Traditional reading, writing and speaking track. It runs today outside the Hub, through My AFRP and the CRM."
  who: "Adult learners. Members pay the member rate; a person who is not a member may register at the public rate, with a contact record and not a membership (D60). On the Education branch it is the one rung open at any adult age. In practice (research, 2 Oct 2026): the public page still says registration is open to adult AFRP members only; see Q-171."
  year: "Three terms a year: a fall term from September, a spring term from January, each of 12 weekly online sessions (Thanksgiving or Easter week off), and a short summer enrichment term. A priority window for past students and waitlisted learners opens each term before general registration (Arabic committee records, 2025–2026). Launched in September 2024 with five Traditional and four Conversational levels; a 2026 summer pilot ran on a learning platform (annual report, 2026; Q-170)."
  organiser: "The Arabic Program Committee, a standing committee joined through the Committee Interest Form, with the Federation's programme director. The partner college supplies the teachers. What it escalates is not stated."
  money: "ARFECF's Educational Fund (D55): class fees as income and the teaching partner's cost as expense in the approved budget. The partner invoices the Federation per enrolled seat, plus books. Where last year's surplus is held is an open action for the committee. Figures are not given here. In practice (research, 2 Oct 2026): from the fall 2026 term Women to Women, an ARFHSN sub-fund, sponsors two member women's registrations each term, chosen on a short statement; no rule covers a Care sub-fund paying an Education fee, against D55's separation of the entities; see Q-168. Teacher incentives tied to retention, student evaluations and measurable success were on the committee's August 2026 agenda (Q-169)."
  handoffs: "Open at any age, so no milestone invitation fires into it. The prototype links it to Camp, the Preservation Project and the magazine's Arabic pages. Club presidents recruit its volunteer conversation partners (August 2026). It recruits: the annual report (2026) says learners have joined the Federation through it, a door into membership the rungs do not yet credit."
  strategy_needs:
  - "Arabic classes named a refresh priority by the Strategic Planning Committee (2026)"
  - "A one-page plan for expansion in January 2027 (Arabic committee, August 2026)"
  - "The August 2026 agenda, with no minute of decisions found: enrichment-only classes (anthem, folk songs and hymns, children's stories), a ceiling level for the Traditional track, the placement test's structure, fall marketing and teacher incentives"
  - "A children's programme as the long-term vision, adults remaining the focus (annual report, 2026)"
  platform_needs:
  - "Only a page, charter and plan exist in the Hub; registration runs today in My AFRP and the CRM"
  - "An extra station for term calendar and enrolment caps (Deep Programs)"
  - "A non-member purchase at the public rate, keeping a contact record and not a membership: a new caller of the one payment door, for the arabic-term design note (D60)"
  - "Pay the teaching partner per seat from the fund that holds the programme (D55)"
  - "A sponsored place paid by another entity's fund posts as a transfer between the two funds with its purpose, once a rule exists (Q-168)"
  - "Count members whose first contact was an Arabic class, for the first-year baseline (D67)"
  questions:
  - "Non-members: answered by D60"
  - "Holding entity: answered by D55 (ARFECF), pending Board confirmation"
  - "Where last year's surplus is held, and whether it stays with the programme (Arabic committee, August 2026)"
  - "What replaces the informal placement call: the committee wants an adaptive placement test"
  - "Which entity signs 1099 contracts for US-based instructors"
  - "May an ARFHSN sub-fund (Women to Women) pay an ARFECF programme's fees for named members, how is it posted, and who approves it? (Q-168)"
  - "Teacher incentives tied to retention or evaluations: a decision for the committee with the partner, and which entity pays (Q-169)"
  - "Which platform holds the summer pilot's learner records, and does D61 or the contact-record rule reach it? (Q-170)"
  - "When does the public page carry the non-member rate D60 adopted? (Q-171)"
