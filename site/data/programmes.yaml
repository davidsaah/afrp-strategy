- key: "congressional-outreach"
  name: "Congressional Outreach"
  branch: "leadership"
  order: 4
  entity: "AFRP (Government Affairs Committee, By-Law 8.15.1): the General Fund (D55, D65)."
  shape: "Committee"
  flagship: false
  status: "Plan only"
  summary: "Year-round advocacy for Palestinian rights at every level of government and across party lines: members meet their own elected officials, and the committee briefs State Department and DHS officials. An issue becomes a statement, a member alert and meetings that are logged."
  who: "AFRP members; the committee arranges meetings with a member's own elected officials and offers a committee member or expert to join."
  year: "Reactive, as issues arise: a statement or letter signed by the President, a member alert with a one-pager, then calls and meetings logged. In 2025–26 the committee also ran virtual and in-person events, a Hill visit, town halls co-hosted with other village associations (each with an 'action' segment asking members to contact their representatives on a named bill), and coalition work with Palestinian-American organisations. The Excel tracker (last edited 2023) was replaced by the committee with an automated meeting tracker (Q-183). No written procedure."
  organiser: "The Government Affairs Committee. Advocacy positions are the Federation's, adopted through governance, not a committee's own. Who clears a position before the President signs is not written down. In practice the chair and co-chair review agendas drafted by two paid congressional-outreach coordinators, and the President opens town halls. The by-law paragraph has the Board establish the committee and appoint its chair and members; no appointment record was found."
  money: "AFRP General Fund (D55, D65); the platform refuses to charge advocacy to ARFECF or ARFHSN (D65). It may also be the by-laws' 'Internships in Washington' Endowed Fund purpose; confirm. Two paid congressional-outreach coordinators sit on the General Fund's contract-labour line. A Washington internship programme (four interns a year, a partner to cover living costs) was voted a Federation contribution at the March 2025 Mid-Year with the funding source left open; ARFECF By-Law 6.3.1 names Internships in Washington as an Endowment purpose (Q-182)."
  handoffs: "Fed by exchange-mission alumni. Feeds and is fed by the Day of Action. Advocacy is organised by district, so it relies on the consented member directory."
  strategy_needs:
  - "Decide whether policy work fits the mission; settled in practice by its place on the Leadership branch (2019 plan)"
  - "Elected-official relations and a stronger advocacy voice (2025 SWOT, subcommittee tasks)"
  - "Government Affairs named a refresh priority (2026)"
  - "Local action committees in the clubs, town halls and a constituent-stories website (the committee's 2025–26 report)"
  platform_needs:
  - "Only a page, charter and plan exist; relationship records are designed to stay tightly scoped"
  - "Advocacy contact as one more consented, refusable channel is designed, not built"
  - "The advocacy workflow (proposed): statement, alert, meeting log, report to the Board"
  - "Charge advocacy only to AFRP's General Fund (D65)"
  - "The platform's outreach register would be a third tracker unless it replaces or reads the committee's own (Q-183)"
  - "Constituent stories need a consent and retention rule before any are held (Q-184)"
  - "The coordinators as staff seats on the committee, and the internships refused a charge until Q-182 names the entity (P25 §2.5, §5.4)"
  questions:
  - "The Washington internships: a voted commitment with no entity named. Which entity pays (the General Fund under D65, or the Endowment purpose under ARFECF 6.3.1), is a stipend to an intern in a congressional office advocacy, and does the register get a programme entry? (Q-182)"
