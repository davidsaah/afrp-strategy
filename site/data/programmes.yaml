# AFRP programmes: one record per programme, on the four branches (D38-D40, D45, D53).
# Generated from the design record; journeys computed from docs/AFRP-Analyst-Dashboard.html.
# Public file: roles only, no living person named, no contact details, no internal budget figures.
# The last eight keys of each entry (in_service to use_cases) were added on 1 October 2026 from the four intakes (D54):
# in service today outside the Hub, the evidence for the holding entity (D55), the clubs' part, partner agreements,
# where records live now, sensitive data and the D61 rule, the programme committee's dated decisions (practice, not
# platform rules), and use cases. "Not stated" means no source was found; it is never a default.
- key: "camp-ramallah"
  name: "Camp Ramallah"
  branch: "education"
  order: 1
  entity: "ARFECF (D55): budgeted in the Educational Fund for 2026–27. Pending confirmation by the AFRP and ARFECF Boards."
  shape: "Cohort"
  flagship: true
  status: "Built"
  summary: "A residential summer camp bringing young members from across the US together for Ramallah heritage, Palestinian history and culture, outdoors. For most people it is the first rung of the whole federation."
  who: "Campers aged 13 to 17 whose parents are members; capacity is in the sixties, set by the facility and the number of volunteers (camp committee, 2026). Counselors must be 19 or have finished a year of college, and must be Federation members in their own right (afrp.org). Counselors-in-training from 18. The 2025 annual report gives the range as 13 to 18 (Q-167). A small delegation of campers travelled from Ramallah in 2025 (Q-166). Counselors apply through My AFRP (afrp.org)."
  year: "December: preparation in the CRM. January–February: flyer, counselor applications and camper registration open. Until full or the end of April: registration, first come, first served. March–May: acceptance letters. May: parents' letter; travel details by form by the end of May. June: camp week (14–20 June in 2026). June–August: rebates to families, counselor reimbursements and the post-camp report."
  rungs:
    hear: "The household of an eligible-age child is told, through the household inbox; counts are banded per club, never a roster of children."
    show_up: "One summer. Attending once is a complete outcome and nothing chases the camper afterwards."
    take_part: "A returning camper, observed from the attendance record and never solicited."
    give_serve: "A counselor, who must first join, consent and hold standing as themselves after turning 18."
    lead: "A seat on the camp committee, which owns the curriculum. People can arrive here without ever having been campers."
  organiser: "A camp committee with a chair, supported by the Federation's programme director, appointed under By-Law 8.1.3 (President-appointed, one-year terms), whose members must meet 8.1.2. The committee decides acceptances; Federation staff administer registration, forms and reimbursements. What it escalates is not stated. In 2025 the volunteer staff were the committee (including a physician), support adults, counselors and a head counselor (annual report, 2026). In August 2026 the President's office set the committee four outcomes: more campers and counselors, a succession plan, a property plan and expanded offerings for families."
  money: "ARFECF's Educational Fund (D55): a Camp Ramallah line in the approved budget, with camper fees as income. The registration fee carries a surcharge unless both parents are members; each family receives a rebate per child after camp, funded by donors; the Federation pays counselors' airfare; families pay campers' airfare. Several clubs add their own rebates, recorded on the club's statement (D57). The camp land account is ARFECF's (D55). Figures are not given here."
  handoffs: "Fed by household records (age). Feeds Project Hope at 18 and, via counselors, Leadership Ramallah at 21. The HS Senior Award is the next rung; it was not retired and continues (D82). The camp committee's proposed college-age conference (August 2026) would sit in it."
  strategy_needs:
  - "More campers from small communities (2025 SWOT)"
  - "More age tiers (2025 SWOT)"
  - "A camp site of its own (2025 SWOT)"
  - "Named a refresh priority by the Strategic Planning Committee (2026)"
  - "Part of the youth pipeline from childhood to professional life (2019 plan)"
  - "Grow campers within capacity and reach clubs that have never sent a camper (camp committee, August 2026)"
  - "The staffing ratio, leadership succession, a property-purchase strategy and business plan, and offerings for families: the four outcomes set by the President's office (August 2026)"
  platform_needs:
  - "Enter the camp facts from the camp committee's records: capacity, the fee rule with its member surcharge, the post-camp rebate, the June week and the committee"
  - "The Hub enforces a per-club quota and a four-per-family cap; no source for either was found in the Federation's records. A question for the Camp committee before either stays in the build"
  - "Club rebates as lines on the club's statement (D57)"
  - "Past seasons come in as camper records only; applications, consent, medical and travel forms never enter, and the platform holds only whether a form is on file (D61)"
  - "Decide which state's camp regulation governs and whether AFRP seeks ACA accreditation"
  - "A written counselor and volunteer vetting, screening and training policy, adopted by the Board, before the platform records any screen (Q-86, Q-165)"
  - "JP-014 stays guarded by design: a paid CIT's record is closed to parents"
  - "Record, for each adult at camp, whether each screen the adopted policy names ran and when, once a policy is adopted (Q-86)"
  - "Campers from Ramallah need their own consent, travel and sponsorship rules before the platform records them (Q-166)"
  questions:
  - "Must a camper's parents be members? The application form (2022) requires member parents and charges a surcharge where one is not; afrp.org states membership for counselors and is silent for campers"
  - "May a club pay a first-year counselor's dues on their behalf (By-Law 8.12.4)?"
  - "The selection rule: the form says first come, first served until full; the Hub's per-club quota and four-per-family cap have no source. Which does the Camp committee mean?"
  - "Which state's camp regulation governs, and is AFRP ACA-accredited or does it want to be?"
  - "Holding entity: answered by D55 (ARFECF), pending Board confirmation. Whether Camp becomes its own tax-exempt entity is under discussion, not decided (camp committee, August 2026)"
  - "Screening (Q-86): no written screening or training policy is on file. Does the Board adopt a screening and training policy before the 2027 season, and does it reach counselors, committee members and the physician alike?"
  - "Is the Federation a mandated reporter under the camp state's law, and does the camp hold a written abuse policy? (Q-165)"
  - "Campers from Ramallah: who sponsors, who consents, which account pays travel, and what the record keeps (Q-166)"
  - "The upper age, 17 or 18, and whether a family programme is a camp session or a new programme (Q-167)"
