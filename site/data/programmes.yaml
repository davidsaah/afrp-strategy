    take_part: "A match: a gig or role placed, on a direct contract or through a local employer of record."
    give_serve: "An employer takes on a second placement, or mentors a candidate."
    lead: "Not stated."
  organiser: "A working group of the Federation run from the Executive Committee: the President leads it; the group is the President, the Deputy President, the Legal Advisor, the programme director and two member business owners; the Executive Committee carries its launch on its agenda (August–September 2026); the Board heard it is intended to become part of RBPN. No committee under By-Law 8.15.1 is evidenced, and the owning committee is not yet named (Decision 64; Q-147)."
  money: "Not stated: no fee, sponsor or budget line appears in any 2026 source. Any fee to employers would be AFRP's."
  handoffs: "Fed by RBPN's job board and the Convention's business gatherings. Feeds RBPN."
  strategy_needs:
