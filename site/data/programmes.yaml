- key: "convention"
  name: "The Annual Convention"
  branch: "junction"
  order: 1
  entity: "AFRP, run with the host club under a host agreement (D59)."
  shape: "other"
  flagship: true
  status: "Designed"
  summary: "The Federation's annual gathering, held since 1959 and drawing about 1,300 to 1,400 people: governance, the election and the Assembly floor, the banquet, symposiums, youth events and every programme's moment. It sits on no branch and is reachable from all of them. Hosts are set through 2030."
  who: "AFRP members; membership is mandatory for every attendee, and non-members pay dues with registration. Voting needs dues received by 30 April and certification."
  year: "A city bids at the Mid-Year two years ahead and the host agreement is signed before the Convention (D59). Magazine notice at least 60 days before. Dues by 30 April for the vote. Convention in July. Settlement with the host within 60 days (host agreement); the host's final accounting within 120 days. Hosts: Washington DC 2027, Jacksonville 2028, Detroit 2029, Chicago 2030."
  rungs:
    hear: "The magazine notice at least 60 days ahead (By-Law 10.1.4), a statutory duty; digital notice is added, never substituted."
    show_up: "Registering and attending; voting is separate, and the 30 April franchise cliff is surfaced in March."
    take_part: "The delegation: weighted voting, from which any certified member may extract their own vote."
    give_serve: "The host committee and desk volunteers, handling three kinds of money correctly."
    lead: "The bid, two years out: a host club that bids, hosts and closes the books."
  organiser: "The host club's convention committee with the Federation; the Federation President appoints a Convention Liaison who does not live in the host city (host agreement). A host needs 50 paid members for five consecutive years; it files a final accounting within 120 days. The Convention Innovation Committee reviews the hosting model."
  money: "Registration only through My AFRP; the Federation owns the records. The host agreement records the Federation's share, the holdback, the settlement date and each side's obligations, and the platform produces the settlement statement (D59). Registration and Relief Fund amounts are Federation money from the first dollar; the host's own events are club money until remitted. Keynote and symposium costs are split as the agreement says. The registration fee is rising."
  handoffs: "The junction: every branch leads here and none owns it. The RBPN mixer, Medical Mission report, Women to Women fundraising, the Family Tree presentation, the Preservation exhibit, symposiums, award announcements and the alumni event happen here."
