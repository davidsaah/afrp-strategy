- key: "rbpn"
  name: "Ramallah Business & Professional Network"
  branch: "leadership"
  order: 2
  entity: "An AFRP committee with a seat on the AFRP Board (By-Law 6.2.2); its first budget was approved by ARFECF's Board (business plan, 2019). D55 does not name it."
  shape: "other"
  flagship: true
  status: "Built"
  summary: "A network for members in business and the professions: mixers, a LinkedIn group, a speaker series, local gatherings and, in earlier years, an annual conference. It holds one voting seat on the AFRP Board."
  who: "AFRP members at any career stage, in fields from healthcare and STEM to law and the arts. One ambassador per club; clubs that host its events are reimbursed (business plan, 2019; D57). afrp.org (re-established July 2017) says events are for members only and gives no join step; no ambassador is named in 2026."
  year: "A mixer during Convention week, included in base registration. A speaker series from September 2026, local happy hours in several cities by year end, and slots at the Mid-Year and the next Convention (RBPN committee, August 2026). An annual conference ran from 2018 to 2022. The first speaker event was held on 23 September 2026; a joint Mid-Year session with Leadership Ramallah and the Young Leaders Committee is planned for January 2027."
  rungs:
    hear: "A consented professional field on the member record; every field is its own switch."
    show_up: "The Convention mixer, included in registration; check-in is the evidence."
    take_part: "Enrolment in the network and attendance at training courses. A directory entry alone is not rung 3."
    give_serve: "Mentoring, teaching a session or sponsoring; a mentor sees only their own mentee, and only while paired."
    lead: "The RBPN seat on the AFRP Board (By-Law 6.2.2), seated by motion."
  organiser: "The RBPN Committee and its own board, with the Federation's programme director; one RBPN member holds a voting seat on the AFRP Board. What it escalates is not stated. The committee directory (2026–27) lists about nine members with no board titles; the Board's RBPN seat is filled."
  money: "An AFRP committee whose first budget ARFECF's Board approved (business plan, 2019). Income has been registration fees and sponsorships; clubs that host RBPN events are reimbursed (D57). Dues are undecided. Paying for a listing on the platform is not decided, so the desk records payment and does not charge. No RBPN line was found in the 2026–27 budget pages read; whether the 2019 model of ARFECF Board approval has lapsed is open (Q-55)."
  handoffs: "Fed by Leadership Ramallah, scholarship alumni and the Convention mixer. Feeds mentoring, Medical Mission recruiting and Board service. Its job board sits beside AFRPWorks on the Leadership branch (D64)."
