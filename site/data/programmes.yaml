- key: "leadership-ramallah"
  name: "Leadership Ramallah"
  branch: "education"
  order: 6
  entity: "Not named in D55. The approved budget (2026–27) carries it inside the Educational Fund's youth line, to be split out; ARFECF's by-laws name the Leadership Program among the Endowment's purposes. For the Boards to confirm. The President's letter (December 2024) names the Endowment's annual proceeds as the programme's sustaining source, consistent with ARFECF By-Law 6.3.1 (Q-177)."
  shape: "Cohort"
  flagship: true
  status: "Plan only"
  summary: "A two-day summit for young Palestinian-American adults, held alongside the Mid-Year Meeting, with expert-led workshops on leadership, advocacy and cultural preservation, a case-study lab, a pitch competition and a career panel."
  who: "Active AFRP members aged 21 and over (with occasional flexibility). Introduced in 2012 for ages 20 to 40 (Community Report 2017–18); the floor is now 21 with no ceiling. Cohorts of about twenty in 2024 and 2025 and fifteen in 2023 (public annual reports); the committee speaks of a historical capacity of about fifteen and a budget that may support fewer. Standing is By-Law 4.3.1 in full: national and club dues both current; accepted participants must be current by a stated deadline or lose the place (acceptance letters, 2024)."
  year: "Applications open in the autumn (afrp.org: 'each fall'); the 2025 deadline was 10 January for a March summit. The agenda is finalised in November; the summit runs Friday afternoon and Saturday at the Mid-Year Meeting (March 2024, 2025 and 2026). The 2027 summit is on 15–16 January with the Mid-Year, where RBPN, the Young Leaders Committee and Leadership Ramallah are to meet together (Q-176). Reimbursements on receipts afterwards; a feedback survey and video testimonials before leaving."
  rungs:
    hear: "An invitation to former camp counselors reaching 21, naming what they already did. One-summer campers are not listed."
    show_up: "The two-day summit; standing is checked at the door and a refusal names which dues lapsed."
    take_part: "The cohort. It is too small to report on, so anything published is suppressed."
    give_serve: "An alum who comes back to facilitate a session."
    lead: "A seat won nearby: the summit sits beside the Mid-Year Meeting, where Member-at-Large candidacies are filed."
  organiser: "The Leadership Ramallah Committee, with two co-chairs and the Federation's programme director, who review and choose applicants. The selection protocol is not on file. What it escalates is not stated. In practice (research, 2 Oct 2026): the two co-chairs are also the Young Leaders Committee's co-chairs, and the committee directory (2026–27) has no separate Leadership Ramallah tab (Q-175). The programme director writes minutes from the meeting transcription; the President opens the summit and sits in strategy meetings."
  money: "The Federation pays the hotel, half of travel up to a cap, a lunch and a reduced banquet; the participant's club is expected to cover about half of travel, and the Federation's travel share applies only where the club does not; participants pay registration, shirts and other meals (written cost rules, 2026; D57). The budget sits inside the youth line, to be split out. Figures are not given here. The money path the President's letter (December 2024) describes is an Endowment transfer to the Educational Fund and on to the programme line (Q-177)."
  handoffs: "Fed by Camp counselors, Project Hope and scholarship recipients. Feeds the Day of Action, RBPN, and Board and committee seats. A mentorship scheme and an alumni path into RBPN are planned (August 2026). afrp.org already lists a Mentorship Program committee in development, with no members."
  strategy_needs:
  - "Leadership Ramallah held with the Mid-Year (2019 plan)"
  - "Part of the youth pipeline from childhood to professional life (2019 plan)"
  - "A budget of its own, a curriculum, leadership succession and alumni follow-up (Leadership Ramallah committee, August 2026)"
  platform_needs:
  - "JP-054 not built: rung 5 at Camp should fire the rung-1 Leadership invitation"
  - "Only a page, charter and plan exist; no application, cohort roster or alumni record is built"
  - "The 18-21 gap: no programme exists between camp and this summit"
  - "The club's travel share as a line on the club's statement (D57)"
  - "Past participants as programme alumni; applications, essays and résumés never enter; future cycles apply in the platform (D61)"
  questions:
  - "The teen gap, 18 to 21: what programme, if any, fills it?"
  - "The selection protocol: said to exist, not on file"
  - "The budget, once split out of the youth line, and how many places it supports"
  - "Club cost-sharing: answered by D57 (one club-share statement; the programme sets its own terms)"
  - "Are the Leadership Ramallah committee and the Young Leader Committee of By-Law 8.10 one body or two? (Q-175)"
  - "The application window and whether the cost rules are reissued for each cycle, now the summit moves to January (Q-176)"
  - "Does the Endowment transfer fund the programme, and is ARFECF its holding entity once the line is split? (Q-177)"
  - "Mentorship: who runs it and whether it is a rung (P25 §5.6; Q-253)"
