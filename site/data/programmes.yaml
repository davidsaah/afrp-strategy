- key: "ecem"
  name: "Educational & Cultural Exchange Mission"
  branch: "leadership"
  order: 6
  entity: "ARFECF (D55): budgeted in the Educational Fund for 2026–27. Pending confirmation by the AFRP and ARFECF Boards."
  shape: "Cohort"
  flagship: false
  status: "Plan only"
  summary: "Missions to Ramallah since 2014 for American journalists, educators, clergy and political leaders, graduate-student treks, and since 2024 a Palestine Fellowship; in 2026 it is moving to 'reverse missions' and a symposium at the Convention."
  who: "Journalists, educators, clergy, political leaders and graduate cohorts. October delegates are chosen by a vetting subcommittee and a full committee vote, with the coordinator and chair breaking ties (2020 operating procedure); graduate-student treks choose their own people. The Palestine Fellowship is open to members of the AFRP community aged 21 and over."
  year: "An October delegation each year under the 2020 procedure, with the number of delegations decided at least six months ahead (none evident since 2023). Graduate-student treks in spring. The Palestine Fellowship: terms in September, applications by 1 December, quarterly and final reports. 2026: a symposium slot at the Washington DC Convention. In practice (research, 2 Oct 2026): no overseas delegation is planned for 2026–27 and capacity is undecided; no delegation has run since 2023; whether the cycle is suspended, retired or paused is Q-188. Fellowship terms are published in the autumn for a 1 December deadline (2025, 2026); the deadline moved at least once."
  organiser: "The Exchange Mission committee, whose chair holds a rotating three-year term ratified by the Federation President; a four-member vetting subcommittee; the programme coordinator as single point of contact. The chair reports quarterly to the Federation (2020 procedure). What it escalates is not stated. Convention symposia are organised by a Federation committee with the host club, so the Mission's symposium slot is an item on that committee's agenda (Q-125). In August 2026 the President and Deputy President asked the committee for its activities, overseas numbers, capacity and plans to bring people from Palestine."
  money: "ARFECF's Educational Fund (D55): a cultural exchange line and exchange fees in the approved budget. Past partner and sponsor funding under agreements; the Fellowship's 2026 grant came from a private fund through a partner foundation. The Federation pays in-country costs; trip leaders pay their own flights. Figures are not given here."
  handoffs: "Fed by scholarship graduates and young adults. Its alumni are the natural recruits for Congressional Outreach."
  strategy_needs:
  - "Missions, an alumni database, fellowships, an alumni newsletter (2019 plan, 2025 SWOT)"
  - "Reverse missions, media and a podcast, and a Convention symposium (Exchange Mission committee, August 2026)"
  platform_needs:
  - "Only a page, charter and plan exist"
  - "Fellowship applications are not in the record"
  - "An alumni database for mission alumni is not built; the match queue built so far covers scholarship alumni"
  - "Extra station for travel, and for minors abroad (Deep Programs)"
  - "The selection-programmes workflow (proposed), following the 2020 procedure as practice"
  - "The partner-agreements workflow (proposed): the partner agreement's term, notice and reporting duty"
  - "The Mission's symposium slot reaches the Convention as one item on the symposium committee's programme (Q-125)"
  - "Interview and discussion notes governed by the same rule as applications (Q-118)"
  questions:
  - "How participants are chosen: answered by the 2020 operating procedure (vetting subcommittee, committee vote, tie-break by the coordinator and chair); graduate treks choose their own"
  - "How Fellowship awards are decided and paid is not written down: in practice the committee discusses a one-paragraph summary per applicant, with no scoring; what it keeps is Q-118"
  - "Is the five-year partner agreement (a draft extension from 2022) signed, and is it in force after 2025?"
  - "Holding entity: answered by D55 (ARFECF), pending Board confirmation"
  - "Is the October delegation suspended, retired or paused, and who decides its return? (Q-188)"
  - "May Mission funds pay speakers at a Convention symposium, and who approves the slot: the Mission, the symposium committee or the host agreement? (Q-125)"
