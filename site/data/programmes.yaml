- key: "preservation-project"
  name: "Ramallah Preservation Project"
  branch: "heritage"
  order: 1
  entity: "Not named in D55. The evidence points to ARFECF's Education Fund: the scanning vendor's credit account carries the Education Fund's tax-exemption certificate (2026), and the approved budgets of 2018–2022 carried heritage and preservation on the Education Fund page. The pilot's scope of work was signed by the AFRP President. For the Boards to confirm (D55; Q-277)."
  shape: "other"
  flagship: false
  status: "Plan only"
  summary: "A digital archive of Ramallah's history, with a committee since 2017 (committee records; afrp.org gives 2020): photographs, documents, articles and oral histories with migrants and first-generation Americans, shown at Convention exhibits and, in plans, with a museum partner. A digitisation pilot with a scanning vendor is under way, funded by a foundation grant."
  who: "Anyone with materials, stories or time; submissions and interviews are welcome."
  year: "Exhibit preparation from March for the Convention in July, with on-site scanning and oral-history recording; website renewal by January; a foundation grant for digitisation runs October 2025 to September 2026, with its report due in November 2026. The committee meets monthly on Microsoft Teams. The foundation grant's period ended on 30 September 2026 with a balance unspent (Q-108); a second scanning scope was quoted in September 2026, priced per box; the committee sought youth volunteers in February 2026 to rebuild the website, and a Convention poster and exhibit ran in July 2026."
  organiser: "The Preservation Project Committee, which gathers documents, builds exhibits and runs the digitisation project with a part-time archivist under the grant. Who owns copyright and takedown decisions is open. The programme director convenes the monthly meeting and handles the vendor and the grant; the committee has its own mailbox and group address."
  money: "The Federation's budget line, a foundation grant for digitisation (October 2025 to September 2026) and gifts; the scanning vendor's account is on the Education Fund's tax exemption. Whose books hold it is for the Boards to confirm (D55). Figures are not given here."
  handoffs: "On the Heritage cluster: no 'next' step. It wraps the family tree (items attach to tree nodes) and uses magazine back issues and Convention ad books as archive material."
  strategy_needs:
  - "Cultural preservation: digitisation and oral histories (2019 plan)"
  - "A website, recovery of the archive and an outreach programme (Preservation committee overview, 2026)"
  platform_needs:
  - "Only a page, charter and plan exist; the archive itself is not built"
  - "The shared drive is the archive of record; the platform links to it and does not become the archive (D66)"
  - "Archive ingests only consent-classed material; print consent is its own switch"
  - "The partner-agreements workflow (proposed): the vendor's scope of work and the grant's reporting date"
  - "A volunteer prototype site holds archive items with tree profiles; D66 makes the drive the archive of record, and whether the platform links to, absorbs or refuses the prototype is Q-190"
  - "Volunteers under 18 on a programme's team need a rule first (Q-191)"
  - "A grant row with period, budget heads, spend to date and report date, so an unspent balance is seen before it lapses (Q-108)"
  - "The archive index the volunteers' prototype was reaching for, on the platform and linked to the drive (P27 §7.2; Q-261)"
  questions:
  - "Which entity operates the Preservation Project? D55 does not name it; the evidence points to ARFECF (Q-277)"
  - "Who owns the archive's copyright and takedown decisions before member photographs go on a public site?"
  - "Where the archive of record is: answered by D66 (the shared drive)"
  - "Scanning the remaining boxes after the pilot: how it is funded"
  - "What consent does an oral-history recording need (a written release; separate permissions for the community archive, the public web, print and research; takedown and next-of-kin rules), and does the spoken permission cover what is already recorded? (Q-189)"
  - "A second public archive-and-tree site built by volunteers: who owns it, who approves access, and how it relates to the Hub and to D66 (Q-190)"
  - "May minors (16 and 17) serve on a programme's volunteer team, under what supervision and consent? (Q-191)"
  - "The grant's unspent balance at 30 September 2026: what the grant allows, who decides, and whether the second scanning scope is charged to it (Q-108)"
  - "Living third parties named in an oral history (P27 §6.2; Q-261)"
