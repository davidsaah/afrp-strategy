- key: "convention"
  name: "The Annual Convention"
  branch: "junction"
  order: 1
  entity: "AFRP, run with the host club"
  shape: "other"
  flagship: true
  status: "Designed"
  summary: "The Federation's annual gathering, held since 1959: governance, the election and the Assembly floor, the banquet, youth events and every programme's moment. It sits on no branch and is reachable from all of them."
  who: "AFRP members; membership is mandatory for every attendee, and non-members pay dues with registration. Voting needs dues received by 30 April and certification."
  year: "A city bids at the Mid-Year two years ahead. Magazine notice at least 60 days before. Dues by 30 April for the vote. Convention in July. Host's final accounting within 120 days."
  rungs:
    hear: "The magazine notice at least 60 days ahead (By-Law 10.1.4), a statutory duty; digital notice is added, never substituted."
    show_up: "Registering and attending; voting is separate, and the 30 April franchise cliff is surfaced in March."
    take_part: "The delegation: weighted voting, from which any certified member may extract their own vote."
    give_serve: "The host committee and desk volunteers, handling three kinds of money correctly."
    lead: "The bid, two years out: a host club that bids, hosts and closes the books."
  organiser: "The host club's convention committee with the Federation. A host needs 50 paid members for five consecutive years; it files a final accounting within 120 days."
  money: "Platform-collected registration and Relief Fund gifts are Federation money from the first dollar. Off-platform receipts are receivables due at settlement; the host's own hafli is club money until remitted."
  handoffs: "The junction: every branch leads here and none owns it. The RBPN mixer, Medical Mission report, Women to Women fundraising, award announcements and the alumni event happen here."
  strategy_needs:
  - "Convention guidelines (2021 strategic proposal, 2022 MOU)"
  - "MOU terms: host two years ahead; registration data belongs to the Federation; Relief Fund per registration; 60-day settlement"
  - "Online registration run with the host club (2021 strategic proposal)"
  - "Registration and photographs in the app; a live itinerary with reminders (app requirements)"
  - "A programme alumni event at the Convention (2023 minutes)"
  platform_needs:
  - "Nine journeys not built, including J05, J13 and JF-078 to JF-084"
