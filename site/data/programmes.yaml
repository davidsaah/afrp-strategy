  money: "ARFECF's Educational Fund (D55): a Project Hope line and Project Hope donations in the approved budget; ARFECF By-Laws 6.3.1 name it among the Endowment's purposes. Delegates pay their own airfare, booked through Federation staff; in-country costs come from the programme budget."
