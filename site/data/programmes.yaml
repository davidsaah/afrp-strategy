- key: "convention"
  name: "The Annual Convention"
  branch: "junction"
  order: 1
  entity: "AFRP, run with the host club under a host agreement (D59)."
  shape: "other"
  flagship: true
  status: "Designed"
  summary: "The Federation's annual gathering, held since 1959 and drawing about 1,300 to 1,400 people: governance, the election and the Assembly floor, the banquet, symposiums, youth events and every programme's moment. It sits on no branch and is reachable from all of them. Hosts are set through 2030."
  who: "AFRP members; membership is mandatory for every attendee, and non-members pay dues with registration. Voting needs dues received by 30 April and certification. In practice (research, 2 Oct 2026): the membership gate did not fire for at least one 2026 Mid-Year registrant (Q-225)."
  year: "A city bids at the Mid-Year two years ahead and the host agreement is signed before the Convention (D59). Magazine notice at least 60 days before. Dues by 30 April for the vote. Convention in July. Settlement with the host within 60 days (host agreement); the host's final accounting within 120 days. Hosts: Washington DC 2027, Jacksonville 2028, Detroit 2029, Chicago 2030. The close, as practised in 2026: a reconciliation about six weeks after the Convention, the host paid after the President's and Deputy President's approval, and the accounting presented to the Board at its November meeting (Q-221). The 2028 host was decided by the General Assembly under the Legal Advisor's reading of By-Law 10.1.1's last sentence (regions with no qualified bid forfeit their turn). A Convention in Ramallah in 2029 is under review on a requirements checklist (Q-223)."
  rungs:
    hear: "The magazine notice at least 60 days ahead (By-Law 10.1.4), a statutory duty; digital notice is added, never substituted."
    show_up: "Registering and attending; voting is separate, and the 30 April franchise cliff is surfaced in March."
    take_part: "The delegation: weighted voting, from which any certified member may extract their own vote."
    give_serve: "The host committee and desk volunteers, handling three kinds of money correctly."
    lead: "The bid, two years out: a host club that bids, hosts and closes the books."
  organiser: "The host club's convention committee with the Federation; the Federation President appoints a Convention Liaison who does not live in the host city (host agreement). A host needs 50 paid members for five consecutive years; it files a final accounting within 120 days. The Convention Innovation Committee reviews the hosting model. In 2026 the office (the Executive Administrator) prepared the reconciliation from the registration system's transaction report and the host's records, the Deputy President convened a reconciliation meeting with the host's leads, the President and Deputy President approved by a dated reply, and the office paid (Q-221). The Digital Infrastructure Committee builds the registration page. The Legal Advisor describes delegate voting: each community certifies its paid members, who vote on delegates; a member present may vote in person, with the vote deducted from the delegate's total (Q-37)."
  money: "Registration only through My AFRP; the Federation owns the records. The host agreement records the Federation's share, the holdback, the settlement date and each side's obligations, and the platform produces the settlement statement (D59). Registration and Relief Fund amounts are Federation money from the first dollar; the host's own events are club money until remitted. Keynote and symposium costs are split as the agreement says. 2027 is a unified registration including the banquet (Board, May 2026). In practice (research, 2 Oct 2026): the Federation's books carry a dedicated Convention bank account, the host's balance as a liability until paid, and the Federation's fixed share as General Fund income; part of the host fee has run through ARFECF's books (Q-224); ARFECF's balance sheet holds the Relief Fund as its own account (Q-109); and the 2026 settlement netted a sum the host owed and charged a Federation dinner to the host's side without a schedule row (Q-124). The host was paid by cheque (Q-222)."
  handoffs: "The junction: every branch leads here and none owns it. The RBPN mixer, Medical Mission report, Women to Women fundraising, the Family Tree presentation, the Preservation exhibit, symposiums, award announcements and the alumni event happen here."
  strategy_needs:
  - "Convention guidelines (2021 strategic proposal, 2022 MOU)"
  - "MOU terms: host two years ahead; registration data belongs to the Federation; Relief Fund per registration; 60-day settlement"
  - "Online registration run with the host club (2021 strategic proposal)"
  - "Registration and photographs in the app; a live itinerary with reminders (app requirements)"
  - "A programme alumni event at the Convention (2023 minutes)"
  - "A convention playbook and a data template holding each year's history (Convention Innovation Committee, 2026)"
