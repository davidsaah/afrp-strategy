- key: "scholarship"
  name: "Scholarship"
  branch: "education"
  order: 4
  entity: "ARFECF (Decision 3). afrp.org says the scholarship was established by the Ramallah Foundation and is run jointly with AFRP; the record follows the decision."
  shape: "Award"
  flagship: true
  status: "Built"
  summary: "Financial support for college students of Ramallah descent: up to four years of undergraduate support, extended through graduation for medical students, with named scholarships alongside the general fund."
  who: "Students with direct lineage to the original Ramallah families, or sponsorship and approval; full-time at an accredited college; documented financial need; minimum 3.0 GPA."
  year: "Jan-May: applications. 31 May: deadline. Jun-Jul: committee review and ranking. Jul: awards approved. Aug: disbursement. October and each year after: renewal reports."
  rungs:
    hear: "The household of a student in their final school years is told; lineage is checked once, through the family tree, and reused."
    show_up: "An application. Trying is showing up, and the applicant can see what has been received and what is missing."
    take_part: "A continuing recipient, renewed each year; a missed renewal after a bereavement is not lapsed by silence."
    give_serve: "Giving back, from an alumni gift to a named scholarship; service and money rank the same."
    lead: "A seat on the Scholarship Committee, where conflicts with relatives are disclosed on the record."
  organiser: "The Scholarship Fund Committee under ARFECF; no designated officer may stand in for it (6.4.4). The committee enters its own award budget. Who approves the budget is an open question."
  money: "ARFECF's Scholarship Fund, on ARFECF's books with ARFECF's receipts. The by-law's 5% cap is enforced; the 2015 Policy Statement's figures are shown inactive until the document is produced."
  handoffs: "Fed by lineage on the family tree and formerly by the HS Senior Award. Recipients get a free student membership and feed Project Hope, Leadership Ramallah, RBPN and the alumni programme."
  strategy_needs:
  - "Scholarships (2019 plan)"
  - "Part of the youth pipeline from childhood to professional life (2019 plan)"
  - "Recruit 21-35 year-olds; programme alumni events at the Convention (2023 minutes)"
  platform_needs:
  - "JP-020 open: the 5% cap versus the Policy Statement's 4% plus 1% waits on that document"
  - "JP-021 open: members elect a Scholarship Committee that no AFRP by-law constitutes"
  - "The ARFECF determination letter, needed for a receipt's exempt-status claim"
  - "Historic recipient import beyond the alumni match queue"
