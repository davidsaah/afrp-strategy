- key: "medical-mission"
  name: "Medical Mission"
  branch: "care"
  order: 1
  entity: "ARFHSN (D62): ARFHSN's Board appoints the committee's chair and approves its spending; the Federation President convenes. Its gifts are ARFHSN's and receipted by ARFHSN (D56)."
  shape: "Mission"
  flagship: true
  status: "Designed"
  summary: "Volunteer physicians, specialists and health professionals from the US and Palestine building long-term health capacity in Palestine. Active: prosthetics (under an agreement with a university and a rehabilitation centre), neurology capacity, urology and ultrasound-biopsy training, occupational therapy training. Past: a cardiovascular centre, a women's health centre, telemedicine, an emergency-medicine residency, PPE and oxygen, emergency supplies for Gaza and the West Bank, a radiology image system and hospital beds."
  who: "Health professionals as volunteers, and donors. Volunteers are invited by committee physicians and pay their own travel and lodging. No credentialing step for volunteers is written down anywhere."
  year: "Missions about once a year (April 2025, September 2026) with an academic day; specialists are invited about seven weeks ahead. Partner agreements are checked at least 30 days before their annual expiry. ARFHSN's by-laws require a report to the AFRP Board every six months, which the platform produces (D63)."
  rungs:
    hear: "A health professional who consents to show their occupation to programme committees."
    show_up: "The annual report session at the Convention; no follow-up is queued."
    take_part: "Travelling on a mission at the committee's invitation, at the volunteer's own cost. No credential check is written down."
    give_serve: "Giving or serving, ranked equally: a gift receipted by ARFHSN, or hosting and teaching trainees. The most populated rung."
    lead: "A seat on the ARFHSN Board of Trustees, elected by the AFRP Board."
  organiser: "The Medical Mission Committee, a programme of ARFHSN (D62): ARFHSN's Board appoints its chair and approves its spending; the Federation President convenes it. Draft terms of reference give three-year committee terms from January 2024. ARFHSN's Board of Trustees is elected by the AFRP Board and reports to it every six months (ARFHSN By-Laws Art. III §7)."
  money: "ARFHSN's (D56): gifts are receipted by ARFHSN, and the Federation's giving pages collect them as ARFHSN's agent and forward them without delay. Money leaves under D63: a Board vote with a spending ceiling, payment on delivery with two signatories, and a grant closed only with the partner's signed agreement, a delivery confirmation and an equipment inventory on record."
  handoffs: "Fed by RBPN's professional directory and the Convention. Project Hope delegations visit mission sites; Women to Women is its sister programme. Clubs co-fund its grants (D57)."
  strategy_needs:
  - "Medical Mission and human services (2019 plan)"
  - "Understand the Mission's strategy, raise money and build partnerships (Medical Mission overview, 2026)"
  platform_needs:
  - "JP-030 not built: Medical Mission operations carrying the entity banner"
  - "JP-031 not built: human-services intake as a separate store under exact grants"
  - "A written credential policy before a screen"
  - "Patient data must never enter the platform: aggregate counts only"
  - "The care-grants workflow (proposed): request, Board vote with a ceiling, signed agreement, payment on delivery, delivery confirmation and inventory (D63)"
  - "The partner-agreements workflow (proposed), with a renewal check at least 30 days before expiry"
  - "ARFHSN's six-monthly report to the AFRP Board from the ledger and the grants register (D63)"
  - "A mission as an event type: an invited roster, volunteer profiles, no fee, self-paid travel"
