- key: "relief-fund"
  name: "The Relief Fund"
  branch: "care"
  order: 4
  entity: "AFRP (D83, 3 Oct 2026: David's decision for the design record). The deductibility and receipt text waits on the CPA (D9). In practice ARFECF's books carry the account; that is a reconciliation item (the books follow D83, or the Boards revisit; Decisions Register, conflicts table)."
  shape: "other"
  flagship: false
  status: "Plan only"
  summary: "Monthly support to families in Ramallah since 2020, emergency appeals and the annual Ramallah charities, from a separate bank account titled in the Federation's name and reported at every Board meeting by the Educational Fund Treasurer. The Board votes emergency support; the Federation's representative in Ramallah distributes it on lists from local partners and reports counts and totals; recipients are told the Federation is the source. ARFECF's accountants book its gifts inside ARFECF; D83 names AFRP as the holding entity, and the books are a reconciliation item."
  who: "Families in need in Ramallah, as recipients; members, clubs and committees as donors. A share of each Convention registration goes to the fund (host agreement)."
  year: "Monthly during an emergency, by Board vote, from 2020 (extended in 2021). Each Convention adds a per-registration amount. The approved budget's Ramallah Charities page funds local charities from the fund each year. The fiscal year runs from 1 June to 31 May. The per-registration amount is posted as one line after each Convention's host settlement; the charities are paid in the fiscal year; seasonal (Christmas) distributions also appear."
  organiser: "The Federation's Board votes the support and requires a distribution plan; the Federation's representative in Ramallah distributes and reports. Fundraising for it goes only through the Federation's procedure (Board minutes, 2020). How the affiliate's part is divided from the Federation's is not written down. The Educational Fund Treasurer files the fund's one-page report (opening balance, deposits, expenses, closing balance) in every Board packet; the Executive Administrator executes transfers and wires. Three kinds of payment are decided three ways: emergency monthly support by the Board's vote with a distribution plan (the only written rule); the annual charities by a budget line voted at the Convention, with no written rule for the list (Q-207); and ad hoc seasonal transfers with no approval on file (Q-109). On the platform the representative's seat is shown as unconstituted until the Board constitutes it (P23 §7; Q-246)."
  money: "A separate bank account titled in the Federation's name, with its balance in each Board packet; the Ramallah Charities page of the approved budget (2026–27) is funded from it. Its regular income is the per-registration amount from each Convention; appeals add to it in an emergency. In practice (research, 2 Oct 2026): money left by wire to the Federation's Ramallah account (2020) and, since 2024, by transfer to the Education Fund account, which wires Ramallah; ARFECF's reviewed statements book relief gifts as ARFECF's donor-restricted contributions and the Ramallah charities as its programme expense, and ARFECF's balance sheet carries the Relief Fund as its own bank account with AFRP owing it; see Q-109. The Treasurer's burn-rate projection assumes the per-registration amount continues to 2030 (Q-126). Figures are not given here. The Convention amount is a term of each year's agreement (P22 §5.3; Q-243)."
  handoffs: "Destination on the Care branch, entered by choice. Fed by the Convention's per-registration amount and by appeals; beside ARFHSN's relief projects and the Medical Mission. The representative also distributes the annual charities, so the Relief Fund and the Ramallah Charities line are one operation in Ramallah."
