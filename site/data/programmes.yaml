- key: "senior-living"
  name: "Senior Living Project"
  branch: "care"
  order: 3
  entity: "Ramallah Foundation, Inc. (Program Architecture), raised through AFRP channels; Program Architecture still asks for confirmation. D55 does not name it. In practice (research, 2 Oct 2026): the sources show the Senior Living Project is the Ramallah Foundation's own capital project: the Foundation, a separate New York private foundation (Form 990-PF), owns, built and will operate the home. The Federation's part is communications and gifts passed through to the Foundation, booked by ARFECF's accountants as restricted gifts received and released, with a Convention-voted ARFECF budget line paid to the Foundation; see Q-203 and Q-204."
  shape: "Campaign"
  flagship: false
  status: "Outside · the Federation's part designed (P23 Part B; Q-203)"
  summary: "The Ramallah Foundation's new senior citizens' home in Ramallah, replacing a 1970s home run by a Ramallah women's union. Ground was broken in October 2023 and the cornerstone laid in June 2024; construction was reported complete in 2026 with an added floor, raising capacity to nearly 70, with furnishing under way, residents moving by the end of 2026, an executive director to be hired and a ribbon-cutting announced for the autumn. The Federation promotes it, has passed gifts to the Foundation and has voted it a budget line; whether it stays on the programme register is Q-203."
  who: "Donors to the Foundation's home, through the Federation or directly. Residents are the Foundation's: the existing home's residents move first, and eligibility is the Foundation's and the women's union's, never the Federation's (Q-203)."
  year: "Milestones: groundbreaking October 2023; cornerstone June 2024; first floors complete 2024; construction complete 2026; residents moving and a ribbon-cutting in autumn 2026. Then the Foundation's operations, in which the Federation has no part on any source. Newsletters (April 2024, January 2025), a page in each annual report, and a flyer to club presidents (July 2026)."
  organiser: "The Ramallah Foundation's board and its campaign lead, a Foundation board member; the Foundation holds a seat on the AFRP Board (By-Law 6.2.2). The Federation's office writes it up in reports, newsletters and a flyer."
  money: "The record's design (Program Architecture §3, §6; JP-032), which the Federation never operated (P23 §9.7; Q-203): A capital campaign with a published goal, in a restricted fund that must never leak into operations; pledges tracked against cash. A senior centre memorial fund is held in the Federation's CRM. In practice (research, 2 Oct 2026): the Federation never held a pledge. Gifts made through the Federation landed in the Education Fund account and were transferred to the Foundation; a Convention-voted ARFECF budget line was paid to the Foundation from the Education Fund; an earmarked transfer from investments was made in 2024. The public instruction today is a cheque to the Foundation, and the President's September 2026 message says the Foundation no longer solicits through the Federation's channels. The Foundation also gives each year to the Federation's funds. The memorial fund held memorial gifts collected for the Foundation's building; see Q-204."
  handoffs: "Destination on the Care branch, entered by choice. Elders may give to the Foundation's home through the Federation (P23 §9.2; Q-204); who lives there is the Foundation's (Q-203). Legacy Giving leads here. ARFHSN made a small grant to a Ramallah senior centre (2026); Legacy Giving's 'leads here' is a site story only."
