- key: "women-to-women"
  name: "Women to Women"
  branch: "care"
  order: 2
  entity: "A sub-fund of ARFHSN (D55): a separate account carried inside ARFHSN's books; it raises money under ARFHSN's exemption and co-funds Care projects. In practice (research, 2 Oct 2026): ARFECF's reviewed statements show Women to Women restricted gifts in one year, released the next, and a Women to Women programme expense; see Q-212."
  shape: "Committee"
  flagship: false
  status: "Plan only · run in practice since 2020"
  summary: "Direct financial help to women in Ramallah and their families for basic needs and self-improvement. Projects are proposed in writing from Ramallah and approved by a committee, which runs its own luncheon and co-funds Care projects."
  who: "Members and non-members as donors and representatives; women in Ramallah as beneficiaries. Since 2026 also young women applying for tuition support, whom the committee evaluates (Q-211)."
  year: "Projects year-round; fundraising at the Mid-Year and Annual Conventions and at its own luncheon. Founded in 2020 as an ARFHSN initiative. A September meeting finalises donations, proposal reviews and student scholarship evaluations (2026). From the fall 2026 term it pays two members' Arabic-class seats each term."
  organiser: "The Women to Women Committee approves projects proposed in writing with a need justification and budget. It attends ARFHSN's meetings as a committee. What it escalates is not stated. A contact in Ramallah receives proposals and disburses against receipts; the committee chair reports at ARFHSN's meetings. In practice the committee approves projects, as the public page says, and the ARFHSN minutes show it reporting, not the Board voting (Q-114)."
  money: "A sub-fund of ARFHSN (D55), receipted by ARFHSN (D56). Gifts are restricted to its purposes; representatives give a minimum yearly gift published on afrp.org. Money leaves under D63. It has also given to the Federation's Relief Fund (ARFHSN minutes, 2020). In practice (research, 2 Oct 2026): money leaves on the committee's approval: gifts enter ARFHSN's US account, are accounted for and transferred to an account in Ramallah, from which the committee's contact disburses against receipts (afrp.org); see Q-114 and Q-104. Funding comes from direct gifts, a book sale, the Convention women's luncheon and a Convention fundraiser; projects fall in a published band (Q-213). ARFECF's books carried Women to Women gifts and a project payment for one year (Q-212). It pays members' Arabic-class seats, an Education fee (Q-168). An endowed fund was raised with the Endowment Committee in September 2026; the CPA's view is that such money stays in ARFHSN's investment accounts as a separately accounted fund, and the AFRP President asked that no new endowed fund be created until a single fundraising strategy exists (Q-210)."
  handoffs: "Destination on the Care branch, entered by choice. Sister programme to the Medical Mission; fundraises at the Convention. It gave to the Relief Fund (2020), co-funded an elevator with ARFHSN (2020), pays Arabic-class seats (2026) and awards tuition beside the Scholarship (Q-211)."
  strategy_needs:
  - "More projects (2025 SWOT)"
  - "Reach younger women (2025 SWOT)"
  - "A representative in each city (2025 SWOT)"
  - "No new endowed fund until a single fundraising strategy exists (the AFRP President, September 2026; Q-210)"
  platform_needs:
  - "Only a page, charter and plan exist; giving goes through the funds path"
  - "Gifts receipted in ARFHSN's name as a sub-fund (D55, D56)"
  - "Grants out through the care-grants workflow (proposed) under D63"
  - "Disbursement through the Ramallah contact against receipts, recorded per project (Q-104, Q-114)"
  - "Tuition applications held by the committee are a selection programme's applicant data (Q-211)"
  questions:
  - "Which entity operates Women to Women: answered by D55 (a sub-fund of ARFHSN)"
  - "Who approves its projects for payment: the committee, ARFHSN's Board under D63, or both? The public page says the committee; D63 says the Board (Q-114)"
  - "May an endowed fund for Women to Women be created inside ARFHSN, under what spending rule and whose approval, and does the AFRP President's hold bind ARFHSN? (Q-210)"
  - "Tuition awards as a selection programme: whose applicant data, and does it overlap the Scholarship? (Q-211)"
  - "Women to Women gifts in ARFECF's books: which entity receipted them? (Q-212)"
