  money: "The Federation pays the hotel, half of travel up to a cap, a lunch and a reduced banquet; the participant's club is expected to cover about half of travel, and the Federation's travel share applies only where the club does not; participants pay registration, shirts and other meals (written cost rules, 2026; D57). The budget sits inside the youth line, to be split out. Figures are not given here."
  handoffs: "Fed by Camp counselors, Project Hope and scholarship recipients. Feeds the Day of Action, RBPN, and Board and committee seats. A mentorship scheme and an alumni path into RBPN are planned (August 2026)."
