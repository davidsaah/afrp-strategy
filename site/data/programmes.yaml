- key: "magazine"
  name: "Hathihe Ramallah"
  branch: "heritage"
  order: 2
  entity: "Its assets have been held by ARFECF since November 2022 (D55); it has its own board (By-Law 6.7.1). In practice (research, 2 Oct 2026): no board roster, minutes or appointment record for the 6.7.1 board was found; the sources show a staff and a treasurer; see Q-192."
  shape: "other"
  flagship: false
  status: "Built"
  summary: "The Federation's magazine since 1952, published bimonthly in English and Arabic, carrying family news, recognition lists and statutory notices. On the platform its printed sections are generated from live data at a copy freeze."
  who: "Subscribers and members; members appear through life events they record and consent to print. Subscribers include non-members and households; since the May/June 2025 issue print goes only to paid print subscribers, and a digital copy comes with a renewed membership."
  year: "Six issues a year; the September/October issue is the Convention issue; in 2026 the digital issues went out by email campaign in June and August. An appeal when renewals lag: in 2026 it ran in August (email to younger contacts, a letter through the mailing house to older households) before the Convention issue. The subscription price rises in 2027; auto-renew needs a saved card. An issue cycle: window opens, copy freeze, proof, press, mail and archive."
  organiser: "The magazine's own board, with an executive editor, a subscription manager, a general manager, an Arabic editor and a design agency (magazine overview, 2026). The magazine's authority is its own and no federation grant confers it. In practice (research, 2 Oct 2026): the staff are an executive editor, an Arabic editor, a general manager, a subscriptions and circulation manager, an advertising role and a treasurer who files the chequebook report, with stipends per issue; announcements reach the editor through a city correspondent or the magazine's mailbox under published guidelines. The staff's criteria govern candidates' platform articles (By-Law 9.5.2); see Q-192. The 'Manager of the Magazine' of By-Law 9.5.2 is unmapped to any seat (P24 §4; Q-250)."
  money: "Its assets are held by ARFECF (D55); magazine sales appear on the Educational Fund page of the approved budget (2026–27). Subscriptions, appeals and advertising. Magazine money is kept apart from Federation money on the ledger. Income is subscriptions and paid obituary placements; expenses are per-issue stipends, design, the printer and the mailing house; an account opened in September 2023 with a seed deposit; a managed investment account. By-Law 6.7.1 says the Federation shall appropriate the funds that guarantee publication; the 2020 practice of keeping magazine money apart sits alongside that duty (Q-194). Whether an obituary fee is exchange revenue or a memorial gift is open (Q-193)."
  handoffs: "Fed by life events, the family tree's accepted lines, recognition tiers and RBPN listings. Feeds the Preservation archive and is the statutory notice channel for the Convention."
  strategy_needs:
  - "Hathihe Ramallah in the app (2020-21 app requirements)"
  - "Magazine money kept apart from Federation money (2020 minutes)"
  - "A newsletter on a fixed schedule (PR audit)"
  - "Financial sustainability and a membership-fee strategy (magazine overview, 2026)"
  - "A Magazine board as By-Law 6.7.1 describes it, if one is to exist (Q-192)"
  platform_needs:
  - "Magazine operations built (slices 7, 7b); five journeys are guarded refusals by design"
  - "The ads desk's payment path refuses until paying for ads on the platform is decided"
  - "The delivery allowance is unset, so the activities section refuses to compute"
  - "Live payments wait on slice 5"
  - "Receipts and books for the magazine follow ARFECF as the holder of its assets (D55, D9)"
  - "The magazine's live data today is an inbox and a city correspondent: the generated sections need the correspondent seat to enter events on a household's behalf with consent (Q-195)"
  - "Obituaries are family-submitted paid placements with a tribute; the design treats deaths as family-approved and does not say whether the fee is exchange revenue or a gift (Q-193)"
  - "One subscription list with the print/digital flag, from which the mailing house's list for each issue is produced"
  - "Designed in P24 (`AFRP-Magazine-Operations.md`, MG1–MG7): the subscriber ledger, the assisted submission, the obituary as an order, the hand-offs, the board seats as empty rows, the money table and the back-issue register"
  questions:
  - "How many issues a year: answered, six. The real deadlines: answered in part by the 2026 campaign dates"
  - "Five auto sections or six? (the magazine committee's question) In practice the printed life-event types are four (weddings, births, graduations, obituaries) and obituaries are paid"
  - "What page budget does each auto section get?"
  - "Is the digital issue a member benefit, a subscriber benefit or public, and are back issues to be open once scanned? (Q-196)"
  - "Should the magazine be bundled into membership? (raised at the General Assembly, 2024)"
  - "Does the Magazine have the 'independently selected Board' of 6.7.1, and how is the 6.2.2 seat appointed? (Q-192)"
  - "What is an obituary placement fee, and which entity receipts it? (Q-193)"
  - "By-Law 6.7.1's funding duty against 'magazine money kept apart' (Q-194)"
  - "Who may enter a life event for a household (the correspondent seat), and what consent must the correspondent hold? (Q-195)"
  - "Who set the Magazine's subscription policies under 6.7.1? (P24 §4; Q-249)"
  - "The 'Manager of the Magazine' of By-Law 9.5.2: unmapped to any seat (P24 §4; Q-250)"
  - "A subscriber who is not a member: the postal address and the list (P21 §2; Q-239)"
