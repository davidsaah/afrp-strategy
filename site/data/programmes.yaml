- key: "bookstore"
  name: "Bookstore"
  branch: "heritage"
  order: 3
  entity: "Per title (P24 §8.2): the cook book's sales are Educational Fund income in the approved budget, so ARFECF for that line (D55's test); the other titles have no budget line and their entity is not stated (Q-197). The consolidated platform map's 'AFRP' has no document behind it. In practice (research, 2 Oct 2026): the stores run on AFRP's website and portal, while the cook book's sales are Educational Fund income and its fund is reported by the Educational Fund Treasurer, which points to ARFECF for that line; the other titles have no line; see Q-197."
  shape: "other"
  flagship: false
  status: "Built"
  summary: "An online store for books, magazine back issues, clan books, merchandise and digital downloads, with member pricing for members in good standing (the design). In practice the Federation sells books through two online stores, one on afrp.org and one on the member portal, with seven and six titles, to US addresses only, with no member price, stock figures or digital goods; back issues, clan books, merchandise and downloads are not sold. The Federation's own overview sheet is an empty template, and no owner is recorded."
  who: "Members and the public; the member price applies only when signed in. In practice neither store shows a member price, and both sell to US addresses only (Q-199)."
  year: "Not stated, except that the cook book is reprinted when stock runs out (2019–20)."
  organiser: "Whoever holds the store:manage grant runs the catalogue and inventory. Who fulfils orders is an open question. No committee is listed (overview sheet, 2026). In practice the office takes online orders through the two stores and the Educational Fund Treasurer reports the Cook Book fund; nobody is recorded as the store's owner (Q-197)."
  money: "Sales are exchange revenue, never a gift; sales tax collected is a liability. The use-case note (§5.3) designs Michigan first with a nexus monitor; whether Michigan registration exists is Q-198. Payments are simulated until slice 5. In practice the Cook Book fund is a separate chequebook reported to the Board by the Educational Fund Treasurer: book sales and interest in; printing and, in 2025–26, a transfer to the Education Fund for the Federation's accounting and CRM systems out. The cook book, compiled by a Detroit women's union in 1976 and reprinted by the Federation, is also sold through at least one third-party museum store, and a trademark in its name is pending (Q-173). Whether Michigan registration has been made is open (Q-198)."
  handoffs: "On the Heritage cluster: no 'next' step. Sells magazine back issues and clan books; a magazine mention can lead to it. An Arabic dictionary (Arabic Program), the tree's print edition (Family Tree) and the magazine's history DVD (Magazine) are product lines the store would carry (Q-199)."
