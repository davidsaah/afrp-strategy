- key: "family-tree"
  name: "Ramallah Family Tree"
  branch: "heritage"
  order: 0
  entity: "AFRP (the record's line; no budget line found; D55 not applied)"
  shape: "other"
  flagship: false
  status: "Built"
  summary: "The genealogy of the original Ramallah clans and their descendants: about 28,000 individuals, with more to add among those born since 1990 (Family Tree committee, 2026). It sits on the Heritage branch (D53). Every member still has a node on it, and a node is never a lineage claim (D30). A print edition is planned."
  who: "Members; signed in, a member sees the deceased in full and the living in full only inside their own branch (D71), and signed out the living show nothing (D28). Members in current national standing propose changes and the committee decides (D70, D72). In practice (research, 2 Oct 2026): the clan genealogy books need a request approved through an approval 'by agreement with the board', and the interactive tree a personal invitation, so access is by approval rather than membership standing; see Q-200."
  year: "Continuous: proposals, life events and imports queue to the committee. Corrections come in by a form into a sheet; accuracy checks at events in November and March. A short first print run is planned, with a family-update deadline before print (30 September 2027) and sample chapters at the Mid-Year in January 2027. The project was launched at the San Jose Convention in 2003 (afrp.org)."
  organiser: "The Family Tree Committee decides every change: one approval for an own-household life event or a non-structural correction, two from different members for a structural change, with clan stewards who recommend and never approve (D72); imports, exports and direct edits are audited. Undecided questions go to the Membership Committee. The committee lists two members (overview, 2026). In practice (research, 2 Oct 2026): one project lead receives, approves and applies every change, from a form or by email; the programme director convenes strategy meetings; a web agency edits the public page; see Q-200."
  money: "Not stated: print costs have no approved budget (Family Tree committee, September 2026)."
  handoffs: "On Heritage, with the Preservation Project, the magazine and the bookstore. Joining creates a node; life events flow to the household, the magazine and the heritage layer; the Scholarship reads lineage from it; Preservation items attach to its nodes. A GEDCOM link into the CRM is planned (September 2026)."
