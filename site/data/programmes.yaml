- key: "project-hope"
  name: "Project Hope"
  branch: "education"
  order: 5
  entity: "ARFECF (D55): budgeted in the Educational Fund for 2026–27. Pending confirmation by the AFRP and ARFECF Boards."
  shape: "Mission"
  flagship: false
  status: "Plan only"
  summary: "A two-week, hands-on programme in Palestine, run since 1997, that connects young adults to their ancestral homeland through volunteer service and meetings with local organisations, officials and youth. The last delegation to Ramallah travelled in 2023; in 2024 it ran in Washington as a joint programme with the Day of Action, and the committee plans a revival for its 30th anniversary in 2027."
  who: "Young adults aged 18 to 29, Arab and non-Arab, actively engaged in their community, able to commit to the whole trip, with a passport valid six months beyond it. About 20 delegates a year when it ran. afrp.org asks for a valid US passport; the programmes flyer describes a ten-day trip each July, more than 300 alumni to date, and one trip per person."
  year: "Paused. When it ran (2019 procedure): recruitment from October to November, deadline in mid-May, trip in July or August. Revival plan: a new concept paper in October 2026, an alumni call in December 2026, trips resuming in 2027 or 2028, with activities in Jordan as a fallback if Palestine is unsafe. 2024: no trip to Ramallah; the programme was combined with the Day of Action in Washington in November ('Day of Action x Project Hope', advocacy with a service project, applications due 1 October). afrp.org: applications open six months before departure. September 2026: the strategy agenda weighed travel feasibility, alternatives that keep the mission and a possible 2029 Convention in Ramallah as a hook; an alumni list and a committee slate are being compiled for an October 2026 meeting with the President and Deputy President."
  organiser: "A Project Hope committee and a trip leader with a three-year term; applicants are chosen by a selection subcommittee of at least two committee members, the programme coordinator and one alumnus (2019 procedure, a draft). What it escalates is not stated."
  money: "ARFECF's Educational Fund (D55): a Project Hope line and Project Hope donations in the approved budget; ARFECF By-Laws 6.3.1 name it among the Endowment's purposes. Delegates pay their own airfare, booked through Federation staff; in-country costs come from the programme budget. A joint year with the Day of Action puts two programmes held by different entities (D55) under one event; which holds the money and which committee decides places is open (Q-172)."
  handoffs: "Fed by Camp Ramallah and scholarship recipients. Feeds Leadership Ramallah at 21 and the Day of Action. Its alumni are the revival's first recruits. The Day of Action is also a documented fallback venue (2024), not only a feed."
  strategy_needs:
  - "Formal processes (2025 SWOT)"
  - "Succession planning (2025 SWOT)"
  - "One trip per person (2025 SWOT, programme flyer)"
  - "A 30th-anniversary revival and committee recruitment from alumni (Project Hope committee, September 2026)"
  - "A possible 2029 Convention in Ramallah as a revival hook (strategy agenda, September 2026)"
  platform_needs:
  - "Only a page, charter and plan exist; no application or trip roster is built"
  - "The one-trip-per-person rule is not in the rules register"
  - "Past participants as alumni records (name, year, club) for the revival; applications, consents and passports stay out (D61)"
  - "The selection-programmes workflow (proposed), shared with Leadership Ramallah and the Exchange Mission"
  questions:
  - "The one-trip-per-person rule: in the flyer and the 2025 SWOT, not in the rules register"
  - "The selection procedure is a 2019 draft partly copied from the Exchange Mission's; will the committee adopt its own?"
  - "Holding entity: answered by D55 (ARFECF), pending Board confirmation"
  - "A joint Day of Action and Project Hope year: which entity holds the money, and which committee decides places? (Q-172)"
  - "Does a Washington year count as a delegation for the one-trip rule and alumni status? (Q-116)"
