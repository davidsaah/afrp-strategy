  shape: "other"
  flagship: false
  status: "Plan only"
  summary: "A yearly advocacy summit on Capitol Hill: young Palestinian-American adults meet their representatives and senators after training and advocacy-tools sessions with partner organisations. Its history runs back to the Federation's Youth Summit of 2015; in 2026 it was an open registration rather than an application."
  who: "Adults. First-time attendees aged 21 to 35 who are members have registration, hotel and part of their travel covered; everyone else attends at their own expense (afrp.org). In 2024–25 applicants answered about 15 questions on their interest, involvement and experience with elected officials. In 2026 registration was free for all adult members (mailing, September 2026) and open to all adults 21 and over (afrp.org), with first-timers using a unique registration link; no application questions appear in any 2026 source (Q-115)."
  year: "In 2024–25: preparation in August; applications open 1 September; review and the first training in October; the second training in November; the event in mid-November in Washington DC; travel reimbursed afterwards. In 2026: registration to 27 September (mailing) or 2 October (afrp.org), the event on 15–18 November (Q-115). A second trip with a faith-based coalition partner ran in May 2026, the first second trip in a year; whether it repeats is undecided (Q-187)."
  organiser: "afrp.org names a Day of Action Committee; in the Federation's records the programme director and the President run it, with the Government Affairs committee. Who scores applications is not written down. What it escalates is not stated. In 2026 nobody selects: the committee chair and co-chair, the coordinators, a past president and the programme director decide logistics by e-mail, and the President approves event spending by e-mail."
  money: "AFRP General Fund (D55, D65). The Federation books a hotel block and reimburses participants' travel after the event. Figures are not given here. In 2026 a lunch venue was costed per head and the first-timer travel cap was stated in the mailing; others attend at their own expense."
  handoffs: "Fed by Leadership Ramallah and Project Hope alumni and by Congressional Outreach. Its participants facilitate at Leadership Ramallah. Guests from other village and town associations at their own expense are proposed, not decided (Q-186)."
  strategy_needs:
  - "Elected-official relations and a stronger advocacy voice (2025 SWOT, subcommittee tasks)"
  platform_needs:
  - "Only a page, charter and plan exist; the summit would run on the shared event builder, which is not wired for it"
  - "Applications ran on the CRM's event form (2024–25); past participants come in as programme alumni and applications never enter (D61). The 2026 cycle had no application, so the engine's application door would be unused this year (Q-115)"
  - "The advocacy workflow (proposed) and the selection-programmes workflow (proposed)"
  - "The cycle's mode row, application or registration, set by a dated act; a cycle with no mode does not open (P25 §5.3; YL4; Q-254)"
  questions:
  - "Who selects participants, and by what scoring? In 2026 nobody: it was a registration. Whether it is an application-and-selection programme or a registration is Q-115, with one published deadline and one eligibility sentence"
  - "Is the May partner trip a second yearly Day of Action or a one-off? (Q-187)"
  - "Guests from other village and town associations: may non-members attend, under what registration and fee, and does their Hill meeting count as the Federation's? (Q-186)"
  - "Who chooses the mode per cycle, application or registration (Q-254); a cycle with no mode does not open (P25 §5.3)"
