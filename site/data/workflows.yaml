- key: convention
  name: The Convention
  summary: 'The junction where all four branches meet once a year: registration, credentialing, the governance floor, the
    participant layer and the financial close.'
  steps:
  - step: Award the Convention to a qualified bidding club two years ahead; a region that fields no qualified bid forfeits
      its turn (By-Law 10.1.1, as the Legal Advisor read it for 2028 — in practice, research, 2 Oct 2026; P22 §3.1; Q-240);
      one qualified bid by voice or hands (9.1.2), two by a weighted delegate vote (9.1.1(2))
    who: General Assembly
  - step: Register self and household; membership is mandatory for attendees; a non-member guest is a line on the registration
      with a credential class, not a contact (P21 §2; Q-238)
    who: Member
  - step: Select delegates and file the club roster by live feed or dated manual roster; how a club chooses its delegates
      is not written (9.1.3) and is recorded as a dated act (P22 §6; Q-37)
    who: Club officer
  - step: Credential delegates against standing on the remittance ledger and freeze the roll
    who: Credentials committee (time-boxed grant)
  - step: 'Record the host agreement: the Federation''s share, the holdback, the settlement date, the liaison and each side''s
      obligations'
    who: Convention committee; host club president
  - step: Check in delegates and members at the desk; presence feeds the floor's weights (9.1.3; P22 §5.4, §6)
    who: Federation office desk; host volunteers on a time-boxed grant
  - step: Run the floor with weighted delegation; weights freeze when voting opens on a motion (S4)
    who: Presiding officer; elections officer
  - step: Post stamped announcements and answer the help desk, owned and clocked
    who: Convention organisers
  - step: Sell store items and banquet seats; post gross under the convention class
    who: Convention organisers
  - step: Close the books; who bears a deficit reads from that year's host agreement (D59)
    who: Federation treasurer
  - step: Settle with the host club within the agreed period and issue the settlement statement; the close runs as its own
      workflow (Convention close and host payment)
    who: Federation treasurer
