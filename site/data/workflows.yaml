      published guidelines — in practice (research, 2 Oct 2026)
    who: Family (member household); city correspondent
  - step: Enter the life event on the household's behalf with the family's consent recorded, so that the section is generated
      and the household is not asked twice — the seat the design needs (Q-195); the entry is pending, names who entered it
      and from what, and prints nothing until the consent act is on record (P24 §3.2)
    who: City correspondent
