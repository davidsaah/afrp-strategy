- key: care-grants
  name: Care grants and partner projects
  summary: A partner or a committee asks for support; the Board of the entity that holds the money decides with a ceiling,
    the grant is paid on delivery with two signatories, and it closes only when the partner's signed agreement, a delivery
    confirmation and an inventory of any equipment are on record. The outbound side of giving.
  steps:
  - step: Submit a request with its purpose, the receiving partner, quotes and the fund it would draw on
    who: Programme committee, for a partner or a committee member
  - step: Check fit with the programme and with the fund's restriction; a restricted gift is spent only on its purpose (D2,
      D3)
    who: Programme committee
  - step: Dispose of each request in one of four ways — approve with a sum, reject with a reason, refer to the Medical Mission
      committee, or return for itemised detail — in practice (research, 2 Oct 2026); whether the register carries the last
      two as states is Q-217
    who: ARFHSN Board
  - step: Approve with a spending ceiling and record the vote; no approval tiers apply until the holding entity adopts a finance
      manual written for a volunteer board (D63)
    who: The holding entity's Board (ARFHSN's Board for the Medical Mission, Women to Women and Human Services funds; D55,
      D62)
  - step: Record each club's share where clubs co-fund the grant (D57)
    who: Programme coordinator; club treasurer
  - step: Record a club's co-funding when the club's trustee confirms it in the meeting — in practice (research, 2 Oct 2026;
      D57)
    who: Club trustee on the ARFHSN Board; programme coordinator
  - step: Sign the agreement with the receiving partner and place it on the agreements register
    who: Entity chair or designated signatory
  - step: Pay on delivery from the named fund, with two signatories (D63; ARFHSN By-Laws Art. III §5)
    who: Entity treasurer and a second designated signatory
  - step: Confirm delivery and record an inventory of any equipment handed over
    who: Federation representative in Ramallah; receiving partner
