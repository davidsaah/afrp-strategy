  - The 2025 distribution guide (draft) sets a cap on a three-year average; the Federation's budgets apply the policy statements'
    fixed split to the 31 May valuation (Q-35).
  - ARFECF By-Laws 6.3.4 and 6.4.4 let each fund committee alone authorise its spending; in practice budgets are adopted at
    the Convention and the ARFECF Board approves restricted spending (the Federation's approved budgets).
  - The fund policy statements (2012, 2015) require an annual report of donations and distributions by 31 March; none is seen
    after 2013 (the Federation's officer records).
  - D8 requires a purpose catalogue for raising in another entity's name; emergency appeals in 2020 and 2023 were set up ad
    hoc (ARFHSN board minutes).
  - 'In practice (research, 2 Oct 2026): the Senior Living Project is the Ramallah Foundation''s capital project; gifts through
    the Federation reach the Foundation through ARFECF, a Convention-voted ARFECF budget line paid it, and the public instruction
    today is a cheque to the Foundation. No pledge was ever held in a Federation system (Q-203, Q-204; JP-032 describes nothing
    operated).'
  - 'In practice (research, 2 Oct 2026): Women to Women gifts and a project payment appear in ARFECF''s books for one year,
    against D55''s sub-fund of ARFHSN (Q-212). An endowed fund for Women to Women was asked for in September 2026; the CPA''s
    view is that it stays in ARFHSN''s investment accounts, and the AFRP President asked that no new endowed fund be made
    before one fundraising strategy exists (Q-210).'
  - 'In practice (research, 2 Oct 2026): the public giving page offers no Relief Fund purpose (Q-208); D8''s purpose catalogue
    does not yet hold the wording of past appeals as published (Q-218); a public statement that all donations go to programmes
    sits beside insurance, CPA and card-fee costs in ARFHSN''s books (Q-215).'
