- key: relief-disbursement
  name: 'Relief Fund: money in and three paths out'
  summary: A separate account in the Federation's name, reported at every Board meeting by the Educational Fund Treasurer.
    Money comes in after each Convention and from appeals; it leaves by three paths decided three ways, and only the first
    has a written rule. AFRP holds the fund (D83, 3 Oct 2026); the receipt's deductibility text waits on the CPA, and ARFECF's
    booking of the fund is a reconciliation item.
  steps:
  - step: Deposit the per-registration amount from each Convention's settlement as one dated line; take appeal gifts in an
      emergency through the Federation's procedure (By-Law 11.1.4) — in practice (research, 2 Oct 2026)
    who: Executive Administrator
  - step: 'Path 1, emergency support: vote a sum per month for a term with a distribution plan and the condition that recipients
      are told the Federation is the source; extend by a further vote (the only written rule; the Board''s votes of 2020–21
      and the General Assembly''s of 2021)'
    who: AFRP Board; General Assembly
  - step: 'Path 2, the annual Ramallah charities: vote the line on the Educational Fund page of the budget at the Convention,
      funded from the Relief Fund; the list of organisations and the amount for each is not written (Q-207); the platform
      refuses to mark the distribution approved while that list''s authoriser row is empty (P23 §4.2)'
    who: General Assembly; the Federation's representative in Ramallah
  - step: 'Path 3, ad hoc: a seasonal distribution or a one-off wire went out in practice with no approval on file; on the
      platform it is refused without an approval act (P23 §4.3; Q-109)'
    who: Executive Administrator executes; approver not on file
  - step: Transfer from the Relief Fund to the Education Fund account and wire the Federation's Ramallah account, recorded
      as one linked act on both chequebooks — in practice since 2024 (in 2020 the wire went direct)
    who: Executive Administrator; Educational Fund Treasurer
  - step: Distribute in Ramallah from an account that needs two local signatures; report counts, amounts, dates and organisations
      from the beneficiary-organisation register, never a person (P23 §7; Q-246, Q-247)
    who: The Federation's representative in Ramallah
  - step: File the one-page statement (opening balance, deposits, expenses, closing balance) to every Board meeting beside
      the Education Fund and Cook Book statements (Q-174)
    who: Educational Fund Treasurer
  - step: Post to AFRP, the holding entity (D83); a gift is receipted without a deductibility claim until the CPA settles
      the text (D9; P11 §4); ARFECF's booking of the fund is a reconciliation item (the books follow D83, or the Boards revisit)
    who: Platform
  - step: Keep family lists outside the platform; a relief payment carries a count and an amount (P11 §4)
