  rule_vs_practice:
  - The 2024 by-laws make good standing need AFRP and club dues; the 2026 restated draft defines standing on AFRP dues alone.
    Whether the restatement was adopted is unknown (Q-33).
  - The 2024 by-laws make club dues part of good standing; no document says whether a member may opt out of local dues, and
    one club collects national and local dues separately (the Federation's club records; Q-36, the rule stays D1).
  - 'In practice (research, 2 Oct 2026): membership runs on the calendar year with auto-renewal; dues are recognised when
    paid, and the books carry an unused deferred-dues account (Q-233). No account on either side of the chart carries club-collected
    national dues (Q-36).'
  - 'In practice (research, 2 Oct 2026): the current registration system creates a staff-vetted account before any membership
    is bought, with a profile (club, date of birth, occupation, address) and no consent row; that account is the largest set
    of non-members the Federation holds, and its occupation field has been used for outreach. D60''s contact record is narrower
    (Q-70, Q-236).'
  - 'In practice (research, 2 Oct 2026): at least one club''s 2026 draft by-laws admit members more widely than By-Law 4.1.1;
    what such a member''s standing is on the platform is not written (Q-226).'
- key: remittance-ledger
  name: Club remittance and the ledger
  summary: National collects once and remits club money on a periodic run. The ledger posts gross, closes daily as an idempotent
    batch, and books reversals as their own entries.
  steps:
  - step: 'Attest each collection event: member, amount, date, channel, collector'
    who: Club treasurer
  - step: Post the daily close by fund and kind; fees post as an expense, revenue stays gross
    who: Platform; national treasurer
  - step: Hold club dues as a liability to the club; post a receivable from the club for unremitted AFRP dues
    who: Platform
  - step: Produce the remittance run as a statement with carry-forward; it shows on the club's one statement (D57)
    who: Platform
  - step: Approve the run by name
    who: Executive Committee officer
  - step: Handle a reversal as a new entry; after remittance it becomes a receivable (S3)
    who: National treasurer
  - step: Reconcile collections to remittance; a variance opens a queue item with an owner and a clock
    who: National staff
  - step: Settle each affiliate's 'due to' balance (ARFECF, ARFHSN, the Ramallah Foundation) to that affiliate — in practice
      (research, 2 Oct 2026) the books carry these balances and the cadence and approver are not written (Q-232)
    who: Executive Administrator (bookkeeper); General Fund Treasurer
