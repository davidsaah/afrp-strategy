- key: convention-close
  name: Convention close and host payment
  summary: 'After the Convention the Federation and the host club settle on one reconciliation: the office prepares it, a
    reconciliation meeting corrects it, the approvers record dated acts (who they must be is Q-221), the General Treasurer
    pays the host (7.5.1; Q-241) and the accounting goes to the Board. Written from the 2026 close; that year''s signed agreement
    remains the rule (D59).'
  steps:
  - step: Carry the host's balance as a liability due to the host from registration to payment; the Federation's fixed share
      books as General Fund income from the host — in practice (research, 2 Oct 2026)
    who: Executive Administrator (bookkeeper)
  - step: Prepare the reconciliation from the registration system's transaction report and the host's records, with netted
      items each way — in practice (Q-221)
    who: Executive Administrator
  - step: Convene the reconciliation meeting with the host's leads and enter the corrections agreed on it (a sum the host
      owes netted against the release; a Federation-hosted event inside the Convention charged to the host's side) — in practice;
      neither had a schedule row, and a netted item with no schedule row is held while the rest settles (P22 §4, §9; Q-124)
    who: Deputy President; host club leads
  - step: Read deficit responsibility and every other term from that year's signed host agreement; a term the agreement does
      not carry is shown as not stated (D59; Q-129)
    who: Federation treasurer
  - step: Exclude dues collected with registration from the gross; they are remitted, never proceeds (By-Law 5.2; P13 §4)
    who: Platform
  - step: Approve the settlement by a dated reply — in practice; who approves the statement for the Federation and whether
      the Finance Committee's audit step still runs are open (Q-221); whether a reply stands as the countersignature is Q-241
      (P22 §9.4)
    who: President and Deputy President
  - step: Post the per-registration Relief Fund amount from the settlement as one dated line — in practice for 2022–2025;
      whether it continues after 2025 is Q-126 (P22 §5.3; P23 §3; Q-243)
    who: Executive Administrator; Educational Fund Treasurer
  - step: Pay the host by the channel the bank allows for the amount and record the channel against the liability — in practice
      a cheque (Q-222); the payment's signatories are By-Law 11.1.2 (the Treasurer, countersigned by a senior Executive Committee
      officer) and 7.5.1–7.5.2 (the General Treasurer and the Financial Secretary co-sign cheques), which differ; whether
      an approval by reply stands as the countersignature is Q-241
    who: AFRP General Treasurer (P22 §9.5; By-Law 7.5.1); in practice the office issued the cheque (2026)
  - step: Release within the agreed settlement period while the host's final accounting runs on its own clock (By-Law 10.1.7;
      Q-128)
    who: Federation treasurer; host club treasurer
  - step: Show the settlement on the host club's statement (D57)
    who: Platform
  - step: Present the Convention's accounting to the Board at its next meeting — in practice
    who: Federation office; AFRP Board
