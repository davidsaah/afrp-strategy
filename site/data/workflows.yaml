    its paid members, those members vote on delegates, delegates cast the votes, and a member present may vote in person with
    the vote deducted from a delegate''s total. The quorum rule and how a community''s vote is held are unwritten (Q-37).'
  - 'In practice (research, 2 Oct 2026): the Mid-Year guideline (2020–21) has the Executive Committee select the host and
    approve a sharp fee rise in writing; in 2026–27 the Board chose the host after quotes, the Federation signed the hotel
    contract, and sponsorship was raised by committee members by region and processed through ARFECF (Q-92, Q-224).'
  - 'In practice (research, 2 Oct 2026): a 2029 Convention in Ramallah is under review against a requirements checklist with
    gates and a GO / HOLD / RELOCATE / POSTPONE / CANCEL decision; a Federation-hosted Convention abroad is a model the templates
    do not carry (Q-223).'
