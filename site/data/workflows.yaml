- key: club-migration
  name: Moving a club from Breeze
  summary: One club at a time, with a named owner on each side, from read-only access to a dated cutover. Nothing is written
    to Breeze; no pair is merged by software; the club's officers verify their own roster before anything moves.
  steps:
  - step: Choose the club and name its owner on each side
    who: Federation staff with the club president
  - step: Give read-only API access; the key is held as a secret, never in the repo
    who: The club's Breeze Account Owner, the only holder of the key
  - step: Extract people, families, tags, events, attendance, form entries, volunteer roles, the custom fields and the consent
      flags as found into staging rows, through the vendor's API at its rate limit (attendance is not in the account export)
      with the account export as the fallback; report which custom fields and forms the club used and what will not move (notes,
      files, photos, recurring gifts)
    who: Platform
  - step: Resolve identities against the register; send the review band to the merge queue
    who: Match-queue reviewer, then the club secretary
  - step: Run both systems in parallel for two to four weeks, the platform read-only for the club; verify the roster, groups
      and events
    who: The club's officers
  - step: Sign off and cut over as a dated decision; writes move to the platform and Breeze becomes read-only
    who: Club president and treasurer
  - step: Keep the final export on the drive (D66); the club cancels its own subscription only after the export is verified,
      because the vendor queues the account for deletion on cancellation
    who: Federation staff; the club
  - step: A club not on Breeze follows the same path from a spreadsheet upload
    who: The club's officers
