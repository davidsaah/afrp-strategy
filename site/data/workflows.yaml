  owner: Federation — the national treasurer produces the run and an Executive Committee officer approves it (D1)
  could_share: Every other club amount, on the one club statement (D57)
  trigger: Each collection; the daily close; the periodic remittance run
  frequency: Daily close; remittance on a periodic run (cadence open)
  records: Collection attestations, daily batches by fund and kind, receivables, reversals, remittance statements and approvals
  money: Club dues held and remitted to clubs; AFRP dues owed by clubs; processing fees as an expense
