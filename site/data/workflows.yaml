  rule_vs_practice:
  - The 2024 by-laws require club money for AFRP projects to pass through headquarters; Mid-Year sponsorship cheques are made
    payable to the host club (the Federation's Mid-Year records, 2026).
  - D1 holds club-collected AFRP dues as agent and remits by run; no written remittance rule appears in the Federation's records
    since 2009, and the current member database computes a "due to local club" amount on event payments with no written rule
    behind it (Q-36).
  - 'In practice (research, 2 Oct 2026): since 2026 card payments run through one processing account per entity (AFRP, ARFECF,
    ARFHSN), replacing one AFRP account with transfers by hand; the registration system''s pay links name the receiving entity''s
    processor profile; QuickBooks Online holds AFRP''s and ARFECF''s books, fed from the registration system. AFRP''s chart
    holds each affiliate purpose collected on the affiliate''s behalf as a ''due to'' liability — D1''s agency treatment and
    D56''s one door then remit, in the books for affiliates though not yet for club dues (Q-232).'
  - 'In practice (research, 2 Oct 2026): the only club-share figure in any system is the registration system''s per-payment
    ''due to local club'' (the payment less the discount and the card cost); it is not a remittance or a settlement (Q-36,
    Q-127).'
  - 'In practice (research, 2 Oct 2026): four roles answer to ''the CPA'': the outside firm that reviews or audits and files,
    the General Fund Treasurer, a volunteer financial adviser and the bookkeeper. Which countersigns D1''s treatment
    is Q-231.'
