- key: magazine-announcements
  name: Magazine announcements, subscriptions and the issue as run
  summary: 'How Hathihe Ramallah runs today beside the designed issue cycle: announcements reach the editor through a city
    correspondent or the magazine''s mailbox; obituaries are paid placements; the print run goes only to paid subscribers
    through a mailing house; the digital issue goes out as an email campaign; an appeal goes out when renewals lag.'
  steps:
