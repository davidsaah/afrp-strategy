- key: scholarship-renewal
  name: Scholarship award letters, renewal and instalment release
  summary: After selection the office checks documents, writes the letters and the first cheque; each later instalment is
    released only when the scholar's semester documents are verified. The rule is written in the award letter, not in an adopted
    policy (Q-159).
  steps:
  - step: Verify each selected applicant's documents (acceptance letter, transcript, recommendation, statement, and the Ramallah
      track's school-leaving scores) and list the gaps — in practice (research, 2 Oct 2026)
    who: Programme director
  - step: Ask the committee secretary whether to chase a gap or hold the cheque — in practice
    who: Executive Administrator; Scholarship Committee secretary
  - step: Send award, missing-documents and rejection letters in early September, in the Federation's name over the President's
      and the committee secretary's signatures — in practice (Q-158). On the platform each letter is an LT-P row in ARFECF's
      name; with no signatory row it is a draft the office sees and is not sent (P26 §4)
    who: Federation office
  - step: Write the first cheque with the award letter; a missing-documents letter holds it until the gaps close — in practice
    who: Executive Administrator
  - step: File the semester transcript, proof of full-time enrolment with the next semester's schedule, and the cumulative
      GPA after the fall and the winter semester (the 2026 award letter)
    who: Scholar (continuing recipient)
  - step: Verify and release the instalment; a late filing, dropping below full time or below the minimum GPA may suspend
      or cancel the next payment, and a scholar in hardship contacts the office (the 2026 award letter; Q-159). The platform
      itself suspends nothing; see the instalment states below (P26 §2.4)
    who: Federation office
  - step: Draw the award on ARFECF's Scholarship Fund under the committee's authority (D3, D55); which account pays in practice
      is not shown (Q-158)
    who: Executive Administrator, for the fund
  - step: Hold the instalment's state (scheduled, due, verified, released, held, suspended, cancelled) with its verification
      rows; a missed filing holds and never lapses, and only the committee's act suspends or cancels (P26 §2.1–§2.4; Q-256,
      Q-257)
    who: Federation office; Scholarship Committee
  - step: Ask for hardship by a category the committee defines, with no free text; the request opens a follow-up to the office
      and a decision item for the committee (P26 §2.4; Q-159)
    who: Scholar; Federation office; Scholarship Committee
  - step: Announce counts and amounts by track, never names — in practice
    who: Programme director
  - step: Assign a named scholarship to a recipient under its donor's criteria; no instrument or criteria are on file for
      any of them (Q-102)
    who: Scholarship Committee
