- key: join-renew-dues
  name: Join, renew and pay dues
  summary: 'A person joins through one front door, then renews national and club memberships that lapse independently. Standing
    is always scoped: national or a named club, never "in good standing" alone.'
  steps:
  - step: Verify an email and mobile channel by code before anything is stored beyond a draft
    who: Applicant
  - step: Choose a membership path (individual, family, student, newlywed) and any club memberships
    who: Applicant
  - step: Set consents per field and per channel; the source of each consent is recorded
    who: Applicant
  - step: Pay once at checkout; a payment carrying national and club dues splits at capture
    who: Applicant; platform posts
  - step: A contact who joins confirms the contact record is theirs; the membership is added and each role keeps its own consents;
      no role consent becomes a member consent (P21 §7.2)
    who: Applicant; platform
  - step: Offer 'Find yourself on the family tree'; skipping is a complete answer (D73; P28 §4.4)
    who: Applicant or member
  - step: Receive AFRP's receipt and a first-login checklist (household, consent, directory, tree)
    who: Platform
  - step: Renew each scope on its own clock; grace is shown as grace, never rounded to current
    who: Member
  - step: Record dues collected by a club; standing starts at collection, not remittance
    who: Club treasurer
